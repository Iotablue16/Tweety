<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102440"><title>Status IA</title>
<style>
:root{color-scheme:dark;--bg:#09182b;--card:#102440;--panel:#173455;--ink:#e7f3ff;--mute:#a5c1dc;--line:#285078;--acc:#54b5ff;--acc-ink:#071a2c;--me:#197ac4;--bub:#173756;--soft:#122d4b;--shadow:rgba(0,0,0,.18)}:root[data-theme="black"]{--bg:#000;--card:#0d1117;--panel:#151b24;--ink:#f3f4f6;--mute:#9aa3af;--line:#2b2f36;--acc:#1d9bf0;--acc-ink:#fff;--me:#1d9bf0;--bub:#171b22;--soft:#0f1726}:root[data-theme="blue"]{--bg:#0b1730;--card:#112744;--panel:#18385a;--ink:#edf7ff;--mute:#afd0ea;--line:#2d5676;--acc:#54b5ff;--acc-ink:#071a2c;--me:#197ac4;--bub:#18395d;--soft:#132d4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}.app{max-width:680px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,var(--card),var(--panel));border-inline:1px solid var(--line);box-shadow:0 0 0 1px rgba(255,255,255,.02),0 24px 60px var(--shadow)}header{position:sticky;top:0;z-index:10;background:rgba(16,36,64,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}h1{margin:0;padding:14px 16px 10px;font-size:1.45rem;font-weight:800;letter-spacing:-.03em}.composer,.post,.profile-card,.panel,.strip,.bar,.row,.headline{margin:0}.composer{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}#meAv,.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--me));color:#fff;font-size:1.25rem;box-shadow:0 10px 20px rgba(0,0,0,.18)}.av.s{width:36px;height:36px;font-size:1.1rem}.composer textarea{flex:1;min-height:68px;max-height:160px;border:1px solid var(--line);border-radius:16px;background:rgba(8,17,31,.38);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical;outline:none}.composer textarea::placeholder{color:var(--mute)}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 16px;font:600 .95rem/1 inherit;cursor:pointer;transition:transform .1s ease,opacity .14s ease}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--acc);color:var(--acc-ink)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:8px 12px;font-size:.82rem}.panel{padding:14px 16px;border-bottom:1px solid var(--line)}.profile-card{background:rgba(11,23,48,.6);border:1px solid var(--line);border-radius:18px;overflow:hidden}.banner{height:96px;background:linear-gradient(135deg,#1b5fa9,#59c3ff 45%,#115ea6)}.profile-head{display:flex;align-items:flex-end;gap:12px;padding:0 16px 14px;margin-top:-22px}.profile-head .who{font-size:1.2rem;font-weight:800}.profile-head .hd{color:var(--mute)}.profile-body{padding:0 16px 16px}.meta{color:var(--mute);font-size:.9rem}.statline{display:flex;gap:18px;padding-top:10px;color:var(--mute);font-size:.88rem}.statline b{color:var(--ink)}.feed,.msgs,.comments{display:flex;flex-direction:column}.feed{gap:10px;padding:14px 16px}.post{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.post .body{flex:1;min-width:0}.who{font-weight:800}.hd{color:var(--mute);font-size:.88rem}.txt{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.acts{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:.86rem;padding-top:4px}.acts button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 0}.acts button.on{color:#ff5d94}.comment-box{margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}.comment{display:flex;gap:8px;margin:7px 0}.comment .who{font-size:.94rem}.image{margin-top:10px;border-radius:14px;width:100%;max-height:340px;object-fit:cover;border:1px solid var(--line)}.strip{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}.strip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent;border-radius:14px;background:none;color:var(--mute);padding:8px 10px;font:.8rem/1.2 inherit;cursor:pointer}.strip button[aria-selected="true"]{background:rgba(84,181,255,.08);border-color:var(--line);color:var(--ink)}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:var(--mute);font-size:.9rem}.empty{padding:36px 20px;color:var(--mute);text-align:center}.tabs{display:flex;background:#0c1a2b;border-top:1px solid var(--line);position:sticky;bottom:0}.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:12px 10px 14px;font:600 .95rem/1 inherit;cursor:pointer;border-top:3px solid transparent}.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--acc)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.8);color:#fff;padding:10px 14px;border-radius:999px;font-size:.82rem;opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.sr{position:absolute;left:-9999px}.hidden{display:none!important}#profileEdit{padding:12px 16px 16px;border-bottom:1px solid var(--line)}.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}.field label{color:var(--mute);font-size:.83rem}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(8,17,31,.38);color:var(--ink);padding:10px 12px;font:inherit}.field textarea{min-height:90px;resize:vertical}.field .row{margin-top:8px}.profile-avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--me));font-size:1.6rem}#myChars{display:grid;grid-template-columns:1fr;gap:10px;padding:10px 16px 18px}.mine{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(7,15,27,.35)}.mine b{display:block}.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.78rem;padding-top:6px}.small{font-size:.8rem}.u{display:flex;align-items:center;gap:8px}@media (max-width:420px){.app{border-inline:none}.composer{padding-inline:12px}.feed,.bar,.profile-body,#myChars,#profileEdit,.tabs button{padding-left:12px;padding-right:12px}.tabs button{font-size:.82rem}}</style></head>
<body>
<div class="app">
  <header><h1>Status IA</h1></header>

  <section id="vF">
    <div class="composer">
      <div id="meAv"></div>
      <div style="flex:1">
        <textarea id="pt" rows="2" placeholder="Quoi de neuf ?"></textarea>
        <div class="row between" style="margin-top:10px">
          <div class="row" style="gap:8px">
            <button id="addPhoto" class="btn ghost small" type="button">Photo</button>
            <input id="postPhoto" type="file" accept="image/*" class="sr">
          </div>
          <button id="pb" class="btn primary" type="button">Publier</button>
        </div>
        <div id="photoPreview"></div>
      </div>
    </div>
    <div id="feed" class="feed"></div>
  </section>

  <section id="vM" hidden>
    <div class="strip" id="strip"></div>
    <div class="bar"><span>Messages avec les personnages</span><button id="cl" class="btn ghost small" type="button">Effacer</button></div>
    <div id="chat" class="panel"></div>
  </section>

  <section id="vP" hidden>
    <div class="profile-card">
      <div class="banner" id="banner"></div>
      <div class="profile-head">
        <div id="pAv" class="profile-avatar"></div>
        <div>
          <div class="who" id="pName"></div>
          <div class="hd" id="pHandle"></div>
        </div>
      </div>
      <div class="profile-body">
        <div id="pBio" class="txt"></div>
        <div class="meta">
          <span id="pLoc"></span>
        </div>
        <div class="statline"><div><b id="pFol"></b> abonnés</div><div><b id="pFoll"></b> suivis</div></div>
      </div>
    </div>
    <div class="bar"><span>Mon profil</span><button id="editProfile" class="btn ghost small" type="button">Modifier</button></div>
    <div id="profileEdit" hidden>
      <div class="field"><label for="fName">Nom</label><input id="fName"></div>
      <div class="field"><label for="fHandle">Pseudo</label><input id="fHandle"></div>
      <div class="field"><label for="fBio">Bio</label><textarea id="fBio"></textarea></div>
      <div class="field"><label for="fTheme">Thème</label><select id="fTheme"><option value="blue">Bleu</option><option value="black">Noir</option></select></div>
      <div class="field"><label for="fFol">Abonnés</label><input id="fFol" type="number" min="0"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px"><button id="saveProfile" class="btn primary" type="button">Enregistrer</button></div>
    </div>
    <div class="bar"><span>Mes personnages</span><button id="cMake" class="btn ghost small" type="button">+ Ajouter</button></div>
    <div id="myChars"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Navigation principale">
    <button id="tF" role="tab" aria-selected="true" type="button">Accueil</button>
    <button id="tM" role="tab" aria-selected="false" type="button">Messages</button>
    <button id="tP" role="tab" aria-selected="false" type="button">Profil</button>
  </nav>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<script>
const CH=[{id:'lea',n:'Léa Martin',h:'@lea_en_route',e:'✈️',b:'Voyageuse curieuse, toujours à la recherche de bonnes adresses.',f:48200,l:'Paris, France',p:'#1d9bf0',t:'blue'},{id:'max',n:'Maxime Laurent',h:'@maxlag',e:'🎮',b:'Joueur du week-end, qui aime les défis et les bonnes vibes.',f:12400,l:'Lyon, France',p:'#54b5ff',t:'blue'},{id:'sofia',n:'Sofia Moreau',h:'@sofiam',e:'🎧',b:'Créative, branchée son, café et idées inspirantes.',f:63200,l:'Montreal, Canada',p:'#35c9b0',t:'black'},{id:'nora',n:'Nora Bell',h:'@norabell',e:'🌿',b:'Passionnée par le bien-être et le slow living.',f:18800,l:'Berlin, Allemagne',p:'#8a7cff',t:'blue'}];
const SAFE=['<','>','&','"','\''];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null){localStorage.removeItem(k);return;}localStorage.setItem(k,JSON.stringify(v));}catch{return;}};
const DEF={me:{name:'Moi',handle:'@moi',bio:'Curieux, créatif et toujours prêt à partager.',followers:1280,theme:'blue'},chars:[CH[0],CH[1]],posts:[{id:uid(),author:'lea',text:'J’ai trouvé un super café caché dans le vieux quartier. Le lieu est calme, la lumière est douce et les gens sont sympas.',time:Date.now()-1000*60*22,likes:128,rt:14,cm:[{who:'max',txt:'Très bonne recommandation, ça donne envie d’y aller !'}],img:'',liked:false},{id:uid(),author:'sofia',text:'Le meilleur moyen de commencer une journée créative : 20 minutes sans écran, un bon café, puis une petite idée folle à tester.',time:Date.now()-1000*60*70,likes:96,rt:7,cm:[{who:'nora',txt:'J’adore cette approche !'}],img:'',liked:false},{id:uid(),author:'max',text:'Hier, j’ai enfin terminé un projet qui me tenait à cœur. La satisfaction est énorme quand on laisse le temps à une idée de devenir quelque chose.',time:Date.now()-1000*60*140,likes:208,rt:24,cm:[{who:'lea',txt:'Bravo, ça fait du bien de lire ça !'}],img:'',liked:false}],messages:[],theme:'blue'};
let S={...DEF};
let draftPhoto='';
let activeChat='lea';
function applyTheme(theme){const t=(theme||'blue').toLowerCase();document.documentElement.dataset.theme=t==='black'?'black':'blue';const ti=document.querySelector('meta[name="theme-color"]');if(ti)ti.setAttribute('content',t==='black'?'#000':'#102440');}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);}
function avatar(person){return `<div class="av s">${person.e||'·'}</div>`;}
function age(t){const n=Math.max(0,Math.floor((Date.now()-t)/60000));return n<1?'à l’instant':n<60?n+' min':n<1440?Math.floor(n/60)+' h':Math.floor(n/1440)+' j'}
function load(){try{const raw=ls('statusia');if(raw&&raw.me){S={...DEF,...raw};S.posts=Array.isArray(raw.posts)?raw.posts.map(p=>({...p,cm:Array.isArray(p.cm)?p.cm:[],likes:Number(p.likes)||0,rt:Number(p.rt)||0,liked:Boolean(p.liked)})):[...DEF.posts];S.chars=Array.isArray(raw.chars)&&raw.chars.length?raw.chars:DEF.chars;S.messages=Array.isArray(raw.messages)?raw.messages:[];S.me={...DEF.me,...raw.me};}else{S={...DEF};}}catch{}if(!Array.isArray(S.posts)||!S.posts.length)S.posts=[...DEF.posts];if(!Array.isArray(S.messages))S.messages=[];applyTheme(S.me.theme||S.theme||'blue');}
function save(){ls('statusia',S);}
function renderProfile(){const me=S.me||DEF.me;$('#fName').value=me.name||'';$('#fHandle').value=me.handle||'';$('#fBio').value=me.bio||'';$('#fTheme').value=me.theme||'blue';$('#fFol').value=me.followers||0;$('#pName').textContent=me.name||'Moi';$('#pHandle').textContent=me.handle||'@moi';$('#pBio').textContent=me.bio||'';$('#pLoc').textContent='France';$('#pFol').textContent=String(me.followers||0);$('#pFoll').textContent='0';$('#pAv').textContent='🙂';$('#banner').style.background='linear-gradient(135deg,#1b5fa9,#59c3ff 45%,#115ea6)';}
function renderFeed(){const feed=$('#feed');if(!S.posts.length){feed.innerHTML='<div class="empty">Aucune publication pour le moment.</div>';return;}feed.innerHTML=S.posts.map(post=>{const author=personById(post.author);const name=author?author.n:'Inconnu';const avatarHtml=author?`<div class="av s">${author.e||'·'}</div>`:'<div class="av s">·</div>';const comments=post.cm.map(c=>`<div class="comment"><div class="av s">${(personById(c.who)?.e)||'·'}</div><div><div class="who">${esc(personById(c.who)?.n||c.who||'Quelqu’un')}</div><div class="txt">${esc(c.txt)}</div></div></div>`).join('');const img=post.img?`<img class="image" src="${post.img}" alt="Image de publication">`:'';return `<article class="post"><div>${avatarHtml}</div><div class="body"><div class="row between"><div><span class="who">${esc(name)}</span> <span class="hd">${esc(author?.h||'')}</span></div><span class="hd">${age(post.time)}</span></div><div class="txt">${esc(post.text)}</div>${img}<div class="acts"><button type="button" class="${post.liked?'on':''}">${post.likes} ♥</button><button type="button">${post.rt} 🔁</button><button type="button">Commenter</button></div><div class="comment-box">${comments}</div></div></article>`;}).join('');}
function renderStrip(){const strip=$('#strip');const items=[...CH,...S.chars.filter(c=>!CH.some(x=>x.id===c.id))];strip.innerHTML=items.map(p=>`<button type="button" data-id="${p.id}" aria-selected="${p.id===activeChat}"><div class="av s">${p.e||'·'}</div><span>${esc(p.n.split(' ')[0])}</span></button>`).join('');$('#strip button').forEach(btn=>btn.onclick=()=>{activeChat=btn.dataset.id;renderStrip();renderChat();});}
function personById(id){return [...CH,...S.chars].find(x=>x.id===id)||S.me;}
function renderChat(){const chat=$('#chat');const person=personById(activeChat);if(!person){chat.innerHTML='<div class="empty">Personnage indisponible.</div>';return;}const list=(S.messages.filter(m=>m.to===person.id||m.from===person.id)||[]).sort((a,b)=>a.time-b.time);if(!list.length){chat.innerHTML=`<div class="empty">Aucun message avec ${esc(person.n)} pour le moment.</div>`;return;}chat.innerHTML=['<div class="panel" style="padding:0">',list.map(m=>`<div class="row" style="justify-content:${m.from===S.me.handle?'flex-end':'flex-start'};padding:10px 12px"><div class="msg" style="max-width:80%;padding:9px 12px;border-radius:16px;background:${m.from===S.me.handle?'var(--me)':'var(--bub)'};color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.text)}</div></div>`).join(''),`<div class="row" style="padding:10px 12px;border-top:1px solid var(--line)"><input id="msgInput" value="" placeholder="Écrire à ${esc(person.n)}" style="flex:1;border:1px solid var(--line);border-radius:999px;background:rgba(8,17,31,.38);color:var(--ink);padding:10px 12px;border:none;outline:none"><button id="sendMsg" class="btn primary small" type="button">Envoyer</button></div>`].join('');$('#sendMsg').onclick=()=>{const box=$('#msgInput');const text=box.value.trim();if(!text)return;S.messages.push({id:uid(),from:S.me.handle,to:person.id,text,time:Date.now()});save();renderChat();};}
function renderMyPosts(){const holder=$('#myChars');if(!S.chars.length){holder.innerHTML='<div class="empty">Aucun personnage pour le moment.</div>';return;}holder.innerHTML=S.chars.map(c=>`<div class="mine"><div class="av s">${c.e||'·'}</div><div style="flex:1"><b>${esc(c.n)}</b><div class="hd">${esc(c.h)}</div><div class="stats"><span>${esc(c.b.slice(0,32))}</span></div></div><button class="btn ghost small" data-del="${c.id}" type="button">Retirer</button></div>`).join('');holder.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.del;S.chars=S.chars.filter(c=>c.id!==id);save();renderMyPosts();});}
function publish(){const text=$('#pt').value.trim();if(!text&&!draftPhoto){toast('Écris quelque chose ou ajoute une photo.');return;}const post={id:uid(),author:S.me.handle||'@moi',text,time:Date.now(),likes:0,rt:0,liked:false,cm:[],img:draftPhoto||''};S.posts.unshift(post);save();renderFeed();$('#pt').value='';$('#photoPreview').innerHTML='';draftPhoto='';toast('Publication ajoutée.');}
function addCharacter(){const name=$('#cname')?.value?.trim()||'';const bio=$('#cbio')?.value?.trim()||'';if(!name||!bio)return;const id='char-'+uid();S.chars.push({id,n,h:'@'+name.toLowerCase().replace(/\s+/g,'_'),e:'✨',b:bio,f:0,l:'France',p:'#54b5ff',t:S.me.theme||'blue'});save();renderMyPosts();toast('Personnage ajouté.');}
$('#pb').onclick=publish;$('#addPhoto').onclick=()=>$('#postPhoto').click();$('#postPhoto').onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{draftPhoto=String(fr.result);$('#photoPreview').innerHTML=`<img class="image" src="${draftPhoto}" alt="Aperçu de la publication">`;};fr.readAsDataURL(file);};
$('#cMake').onclick=()=>{const name=prompt('Nom du personnage ?');if(!name)return;const bio=prompt('Petite bio du personnage ?');if(!bio)return;const character={id:'char-'+uid(),n:name.trim(),h:'@'+name.trim().toLowerCase().replace(/\s+/g,'_'),e:'✨',b:bio.trim(),f:0,l:'France',p:'#54b5ff',t:S.me.theme||'blue'};S.chars.push(character);save();renderMyPosts();toast('Personnage ajouté.');};
$('#editProfile').onclick=()=>$('#profileEdit').hidden=!$('#profileEdit').hidden;$('#saveProfile').onclick=()=>{S.me.name=$('#fName').value.trim()||S.me.name;S.me.handle=$('#fHandle').value.trim()||S.me.handle;S.me.bio=$('#fBio').value.trim()||S.me.bio;S.me.theme=$('#fTheme').value||S.me.theme;S.me.followers=Number($('#fFol').value)||S.me.followers;applyTheme(S.me.theme);save();renderProfile();toast('Profil mis à jour.');};
$('#tF').onclick=()=>{$('#vF').hidden=false;$('#vM').hidden=true;$('#vP').hidden=true;$('#tF').setAttribute('aria-selected','true');$('#tM').setAttribute('aria-selected','false');$('#tP').setAttribute('aria-selected','false');};
$('#tM').onclick=()=>{$('#vF').hidden=true;$('#vM').hidden=false;$('#vP').hidden=true;$('#tF').setAttribute('aria-selected','false');$('#tM').setAttribute('aria-selected','true');$('#tP').setAttribute('aria-selected','false');renderStrip();renderChat();};
$('#tP').onclick=()=>{$('#vF').hidden=true;$('#vM').hidden=true;$('#vP').hidden=false;$('#tF').setAttribute('aria-selected','false');$('#tM').setAttribute('aria-selected','false');$('#tP').setAttribute('aria-selected','true');renderProfile();renderMyPosts();};
$('#cl').onclick=()=>{S.messages=[];save();renderChat();toast('Messages effacés.');};
$('#meAv').textContent='🙂';
load();
renderFeed();
renderProfile();
renderMyPosts();
applyTheme(S.me.theme||'blue');
</script>
</body>
</html>
