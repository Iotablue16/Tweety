async function talkBetweenAI(){if(busy)return;if(!API.key){toast('Ajoute une clé API dans Profil pour que les IA discutent.');return}busy=true;$('#talkNow').disabled=true;$('#talkNow').textContent='Discussion…';try{const pool=all();if(pool.length<2)throw Error('Crée au moins deux personnages.');const first=pool[Math.floor(Math.random()*pool.length)];let second;do{second=pool[Math.floor(Math.random()*pool.length)]}while(second.id===first.id);const raw=await ask(`Écris un mini-échange amusant et naturel entre deux personnages de réseau social.\nA: ${first.n}, ${first.b}\nB: ${second.n}, ${second.b}\nRéponds uniquement en JSON: {"message":"publication courte de A","reponse":"réponse courte de B"}. En français, sans narrateur.`,350),d=JSON.parse(raw.match(/\{[\s\S]*\}/)?.[0]||raw),p={id:uid(),who:first.id,text:String(d.message||'Salut !'),t:Date.now(),likes:Math.floor(Math.random()*8),liked:false,rt:0,rted:false,cm:[{who:second.id,text:String(d.reponse||'Bien vu !')}]};S.posts.unshift(p);save();renderFeed();toast(`${first.n} et ${second.n} viennent de discuter.`)}catch(e){toast(e.message||'Discussion impossible.')}finally{busy=false;$('#talkNow').disabled=false;$('#talkNow').textContent='Discussion IA'}}
function readImage(file,max=1000,square=false){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');if(square){const side=Math.min(im.width,im.height);c.width=Math.min(side,max);c.height=c.width;ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,c.width,c.height)}else{const scale=Math.min(max/im.width,max/im.height,1);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,c.width,c.height)}ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function tab(n){for(const [id,x] of [['F','vF'],['M','vM'],['P','vP']]){$('#v'+id).hidden=n!==id;$('#t'+id).setAttribute('aria-selected',n===id)}if(n==='M'){strip();renderMessages()}if(n==='P'){renderMe();renderMyPosts();myChars()}}function strip(){$('#strip').innerHTML=all().map(c=>`<button data-id="${esc(c.id)}" aria-selected="${c.id===cur}">${avh(c,'s')}<span>${esc(c.n.split(' ')[0])}</span></button>`).join('')}function renderMessages(){const c=byId(cur)||CH[0],list=S.dms[cur]||[];$('#chead').innerHTML=avh(c,'s')+`<div><b>${esc(c.n)}</b><div class="hd">${fmt(c.f)} abonnés</div></div>`;$('#msgs').innerHTML=list.length?list.map(m=>`<div class="m ${m.r==='me'?'me':''}">${esc(m.text)}</div>`).join(''):`<div class="empty">Écris à ${esc(c.n)}.</div>`;$('#msgs').scrollTop=$('#msgs').scrollHeight}async function sendMessage(){const text=$('#mi').value.trim();if(!text||busy)return;busy=true;$('#mb').disabled=true;const c=byId(cur)||CH[0],list=S.dms[cur]||(S.dms[cur]=[]);list.push({r:'me',text});$('#mi').value='';save();renderMessages();try{list.push({r:'ai',text:await ask(`Tu es ${c.n}, ${c.b}. Réponds naturellement en français à ce message:\n${list.slice(-10).map(m=>m.text).join('\n')}`,350)})}catch(e){toast(e.message)}save();renderMessages();busy=false;$('#mb').disabled=false}
function myChars(){$('#myChars').innerHTML=S.chars.length?S.chars.map(c=>`<div class="mine">${avh(c)}<div><b>${esc(c.n)}</b><div class="hd">${esc(c.h)}</div></div><button class="btn ghost" data-a="chat" data-id="${esc(c.id)}">Écrire</button><button class="btn ghost" data-a="del" data-id="${esc(c.id)}">Supprimer</button></div>`).join(''):'<p class="helper">Aucun personnage pour le moment.</p>';$('#allChars').innerHTML=all().map(c=>`<div class="mine">${avh(c)}<div><b>${esc(c.n)}</b></div><button class="btn ghost" data-a="photo" data-id="${esc(c.id)}">Changer la photo</button></div>`).join('')}
function form(){for(const [id,k] of [['fName','name'],['fHandle','handle'],['fBio','bio'],['fFol','followers'],['fColor','color'],['fAcc','accent'],['fTheme','theme']])if($('#'+id))$('#'+id).value=S.me[k]??'';aiFields()}function updateProfile(){S.me.name=$('#fName').value;S.me.handle=$('#fHandle').value.replace(/[^a-zA-Z0-9_]/g,'');S.me.bio=$('#fBio').value;S.me.followers=Math.max(0,parseInt($('#fFol').value)||0);S.me.theme=$('#fTheme').value;save();renderMe();renderMyPosts()}
$('#pb').onclick=publish;$('#postPhoto').onchange=async e=>{if(!e.target.files[0])return;try{draftPhoto=await readImage(e.target.files[0]);$('#photoPreview').innerHTML=`<img class="post-image" src="${draftPhoto}" alt="Aperçu de la photo">`;$('#removePostPhoto').hidden=false}catch{toast('Image illisible.')}};$('#removePostPhoto').onclick=()=>{draftPhoto='';$('#postPhoto').value='';$('#photoPreview').innerHTML='';$('#removePostPhoto').hidden=true};$('#feed').onclick=async e=>{const el=e.target.closest('.post');if(!el)return;const p=S.posts.find(x=>x.id===el.dataset.id);if(!p)return;const b=e.target.closest('button');if(!b){openC[p.id]=!openC[p.id];renderFeed();return}if(b.dataset.a==='cm'){openC[p.id]=!openC[p.id];renderFeed()}else if(b.dataset.a==='like'){p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));save();renderFeed()}else if(b.dataset.a==='rt'){p.rted=!p.rted;p.rt=(p.rt||0)+(p.rted?1:-1);save();renderFeed()}else if(b.dataset.a==='send'){const i=el.querySelector('input'),t=i.value.trim();if(t){p.cm.push({who:'me',text:t});save();renderFeed();await react(p,t)}}};$('#talkNow').onclick=talkBetweenAI;
$('#tF').onclick=()=>tab('F');$('#tM').onclick=()=>tab('M');$('#tP').onclick=()=>tab('P');$('#showMyPosts').onclick=()=>{$('#profileEdit').hidden=true;renderMyPosts()};$('#showSettings').onclick=()=>{$('#profileEdit').hidden=false;form();$('#profileEdit').scrollIntoView({behavior:'smooth'})};$('#editProfile').onclick=()=>{$('#profileEdit').hidden=!$('#profileEdit').hidden;if(!$('#profileEdit').hidden)form()};$('#saveProfile').onclick=()=>{updateProfile();$('#profileEdit').hidden=true;toast('Profil enregistré.')};$('#fName').oninput=updateProfile;$('#fHandle').oninput=updateProfile;$('#fBio').oninput=updateProfile;$('#fFol').oninput=updateProfile;$('#fTheme').onchange=updateProfile;$('#fProv').onchange=e=>{API.prov=e.target.value;aiFields()};$('#fKey').oninput=e=>API.key=e.target.value.trim();$('#fModel').oninput=e=>API.model=e.target.value.trim();$('#fPhoto').onchange=async e=>{try{S.me.photo=await readImage(e.target.files[0],220,true);save();renderMe()}catch{toast('Photo illisible.')}};$('#fBanner').onchange=async e=>{try{S.me.banner=await readImage(e.target.files[0],1300);save();renderMe()}catch{toast('Image illisible.')}};$('#fNoPhoto').onclick=()=>{S.me.photo='';save();renderMe()};$('#fNoBanner').onclick=()=>{S.me.banner='';save();renderMe()};$('#fColor').oninput=e=>{S.me.color=e.target.value;save();renderMe()};$('#fAcc').oninput=e=>{S.me.accent=e.target.value;save()};$('#mb').onclick=sendMessage;$('#mi').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('#strip').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){cur=b.dataset.id;strip();renderMessages()}};$('#cl').onclick=()=>{if(confirm('Effacer cette conversation ?')){S.dms[cur]=[];save();renderMessages()}};
$('#cMake').onclick=async()=>{const n=$('#cName').value.trim(),bio=$('#cBio').value.trim();if(!n||!bio){toast('Ajoute un nom et une personnalité.');return}let photo='';if($('#cPhoto').files[0])try{photo=await readImage($('#cPhoto').files[0],220,true)}catch{toast('Photo illisible.');return}S.chars.push({id:'c'+uid(),n,h:'@'+($('#cHandle').value.trim()||n).toLowerCase().replace(/[^a-z0-9_]/g,'')||'perso',e:$('#cEmoji').value||'🙂',b:bio,f:parseInt($('#cFol').value)||1000,p:photo});['#cName','#cHandle','#cBio','#cEmoji','#cFol','#cPhoto'].forEach(s=>$(s).value='');save();myChars();renderMe();toast('Personnage créé.')};$('#myChars').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;if(b.dataset.a==='chat'){cur=id;tab('M')}if(b.dataset.a==='del'&&confirm('Supprimer ce personnage ?')){S.chars=S.chars.filter(c=>c.id!==id);S.posts=S.posts.filter(p=>p.who!==id);save();myChars();renderMe();renderFeed()}};$('#allChars').onclick=e=>{const b=e.target.closest('button[data-a="photo"]');if(!b)return;phId=b.dataset.id;$('#ph').click()};$('#ph').onchange=async e=>{try{const data=await readImage(e.target.files[0],220,true),c=S.chars.find(x=>x.id===phId);if(c)c.p=data;else S.over[phId]=data;save();myChars();renderFeed()}catch{toast('Photo illisible.')}e.target.value=''};
S.posts=S.posts.map(p=>({...p,cm:Array.isArray(p.cm)?p.cm:[],likes:Number(p.likes)||0,rt:Number(p.rt)||0}));renderMe();renderFeed();
</script></body></html>
