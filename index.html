<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tweety</title>
<style>
/* Layout: colonne unique type réseau social, en-tête collant, navigation fixe en bas, fiches profil façon Instagram. */
:root{--bg:#071225;--card:#071225;--ink:#e6edf8;--mute:#8497b5;--line:#1c2e4d;--acc:#3b9cff;--acc-ink:#fff;--bub:#0f2140;--good:#19c37d;--bad:#ff4d6a;--warn:#f5b83d;--rad:14px;color-scheme:dark}
:root[data-t="noir"]{--bg:#000;--card:#000;--ink:#e7e9ea;--mute:#71767b;--line:#2f3336;--acc:#eff3f4;--acc-ink:#0f1419;--bub:#16181c;--good:#00ba7c;--bad:#f4212e;--warn:#ffd400;color-scheme:dark}
:root[data-t="rose"]{--bg:#fff0f6;--card:#fff7fa;--ink:#2a0f1c;--mute:#9a6b82;--line:#f3cfdf;--acc:#e11d79;--acc-ink:#fff;--bub:#fde1ee;--good:#0f9d6a;--bad:#d4163c;--warn:#b97a00;color-scheme:light}
:root[data-t="blanc"]{--bg:#fff;--card:#fff;--ink:#0f1419;--mute:#536471;--line:#e6ecf0;--acc:#0f1419;--acc-ink:#fff;--bub:#eff3f4;--good:#00a06a;--bad:#d81f3c;--warn:#b27d00;color-scheme:light}
:root[data-t="jaune"]{--bg:#fffbe6;--card:#fffdf3;--ink:#26210a;--mute:#8a7a3a;--line:#efe2a6;--acc:#f2b705;--acc-ink:#231c00;--bub:#fff1b8;--good:#0f9d6a;--bad:#c9232f;--warn:#a87400;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-inline:1px solid var(--line)}
button{font-family:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;min-height:54px}
.tl{display:flex;align-items:center;gap:6px;min-width:0}
.tr{display:flex;align-items:center;gap:6px;position:relative}
h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--bub)}
.ib svg,.chip svg,nav svg,.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:none;font-weight:700;font-size:.85rem;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--warn))}
.chip.flash{animation:fl 1.4s ease}
@keyframes fl{0%{background:color-mix(in srgb,var(--c) 45%,transparent)}100%{background:none}}
.pal{position:absolute;right:0;top:46px;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:8;display:flex;flex-direction:column;gap:2px}
.pal .pt{padding:4px 8px}
.sw{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;font-size:.95rem;text-align:left}
.sw:hover{background:var(--bub)}
.sw[aria-pressed=true]{font-weight:800;background:var(--bub)}
.sw .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--mute);flex:none}
.av{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:1.1rem;cursor:pointer}
.av.s{width:34px;height:34px;font-size:.95rem}
.av.l{width:58px;height:58px;font-size:1.3rem;border:2px solid var(--card)}
.av.xl{width:88px;height:88px;font-size:2rem;border:4px solid var(--card);cursor:default}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:.72rem;cursor:pointer;padding:0}
.st .ring{padding:2px;border-radius:50%;background:conic-gradient(var(--acc),var(--bad),var(--warn),var(--acc));display:block}
.st>span:last-child{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cf{flex:1;min-width:0}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;resize:none}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:space-between;margin-top:8px}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:.92rem;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.hd{color:var(--mute);font-size:.88rem}
.live{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--mute);font-size:.85rem;border-bottom:1px solid var(--line)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:color-mix(in srgb,var(--bub) 45%,transparent)}
.post.new{animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(-10px);background:color-mix(in srgb,var(--acc) 16%,transparent)}to{opacity:1;transform:none}}
.body{flex:1;min-width:0}
.who{font-weight:800;cursor:pointer}.who:hover{text-decoration:underline}
.vb{width:16px;height:16px;vertical-align:-3px;margin-left:2px;display:inline}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 8px}
.acts{display:flex;justify-content:space-between;max-width:420px;color:var(--mute);font-size:.9rem}
.acts button,.acts .vw{border:0;background:none;color:inherit;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.acts .vw{cursor:default}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts button:hover{color:var(--ink)}
.acts button.on{color:#f91880}.acts button.on svg{fill:currentColor}.acts button.rt{color:var(--good)}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.dpost{padding:14px 16px;border-bottom:1px solid var(--line)}
.dh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dtxt{font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:10px}
.cmt{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmf{display:flex;gap:10px;align-items:center;padding:12px 16px}
.ban{height:130px;background:linear-gradient(135deg,var(--acc),var(--bub));overflow:hidden}
.ban img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-44px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center;padding-bottom:4px;min-width:0}
.stats b{display:block;font-size:1.1rem}.stats div{font-size:.78rem;color:var(--mute)}
.pinfo{padding:10px 16px 12px}.nm{font-weight:800;font-size:1.1rem}
.bio{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.acts2{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}.acts2 .btn{flex:1;min-width:120px}
.rep{margin:4px 16px 14px;padding:12px;border:1px solid var(--line);border-radius:var(--rad)}
.rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meter{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));margin:12px 0 10px}
.meter i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left .7s}
.log{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute);margin-top:8px}
.log b.up{color:var(--good)}.log b.dn{color:var(--bad)}
.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-top:2px}
.tile{aspect-ratio:1;padding:8px;font-size:.78rem;overflow:hidden;background:var(--bub);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;min-width:0}
.tile p{margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .tf{color:var(--mute);font-size:.72rem}
.tile.good{box-shadow:inset 0 -3px 0 var(--good)}.tile.bad{box-shadow:inset 0 -3px 0 var(--bad)}
.mine{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mine .mi{flex:1;min-width:120px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.strip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--mute);font-size:.8rem;padding:6px 8px;border-radius:12px;cursor:pointer}
.strip button[aria-selected=true]{background:var(--bub);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;color:var(--mute);font-size:.88rem}
.chat{display:flex;flex-direction:column;height:calc(100vh - 330px);min-height:340px}
.chead{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--bub);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.m.ai{border-bottom-left-radius:6px}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:0;background:none;color:var(--mute);font-size:.72rem;font-weight:700;cursor:pointer;border-top:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:min(640px,100%);max-height:92vh;overflow-y:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.shd{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sb{padding:4px 16px 16px}
.ed-row{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-44px;flex-wrap:wrap}
.ed-btns{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute);margin:10px 0}
.fld input[type=color]{width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;max-width:90%;z-index:30;font-size:.9rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.post.new,.live i,.chip.flash{animation:none}.meter i{transition:none}}
select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit}

:root{--lnk:#1d9bf0}:root[data-t="rose"],:root[data-t="blanc"],:root[data-t="jaune"]{--lnk:#1a73e8}
.ln{color:var(--lnk);cursor:pointer}.ln:hover{text-decoration:underline}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line)}.pbar i{display:block;height:100%;width:50%;transition:width .8s,background .8s}
.pimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin:2px 0 8px;display:block;background:var(--bub)}
.prev{margin-top:8px;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:.88rem;overflow-wrap:anywhere}.prev:empty{display:none}
.cmt.rp{margin-left:34px;padding-left:10px;border-left:2px solid var(--line)}
.cmt .acts{max-width:340px}.acts button.del:hover,.acts button.conf{color:var(--bad)}.dl{font-size:.8rem}
.rto{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px;color:var(--lnk);font-size:.85rem}
.cpv{position:relative;margin-top:8px}.cpv img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}.cpv .btn{position:absolute;top:8px;right:8px;background:var(--card)}
.ct{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit}.ct:hover{background:var(--bub)}
.ct .mi{flex:1;min-width:0}.ct .cn{display:flex;gap:6px;align-items:baseline}.cp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{height:calc(100dvh - 54px - 66px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:300px}
.m{max-width:78%;line-height:1.35}.msgs{background:color-mix(in srgb,var(--bub) 30%,transparent)}
</style>
</head><body>
<div class="app">
<header class="top">
  <div class="tl"><button class="ib" id="back" hidden aria-label="Retour"></button><h1 id="ttl">Tweety</h1></div>
  <div class="tr">
    <button class="chip" id="popChip"><i></i><span>Popularité <b id="popTxt">50</b></span></button>
    <button class="ib" id="keyBtn" aria-label="Clé API"></button>
    <button class="ib" id="palBtn" aria-label="Apparence"></button>
    <div class="pal" id="pal" hidden></div>
  </div>
<div class="pbar"><i id="pbi"></i></div></header>
<main>
<section id="vF">
  <div class="stories" id="stories"></div>
  <div class="composer">
    <div id="meAv"></div>
    <div class="cf">
      <textarea id="pt" rows="2" maxlength="280" placeholder="Quoi de neuf ?" aria-label="Nouvelle publication"></textarea>
      <div id="cpv"></div><div class="row end"><button class="ib" id="pimgb" aria-label="Ajouter une photo"></button><span class="hd" style="flex:1">Les autres comptes jugent ce que tu écris.</span><button class="btn" id="pb">Publier</button></div>
    </div>
  </div>
  <div class="live" id="live"><i></i><span id="liveTxt">En direct</span></div>
  <div id="feed"></div>
</section>
<section id="vD" hidden></section>
<section id="vU" hidden></section>
<section id="vM" hidden>
  <div class="inbox" id="inbox"></div>
  <div class="chat" id="chatw" hidden><div class="chead" id="chead"></div><div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="send"><textarea id="mi" rows="1" placeholder="Écrire un message" aria-label="Message"></textarea><button class="btn" id="mb">Envoyer</button></div>
  </div>
</section>
</main>
</div>
<nav role="tablist">
  <button role="tab" id="tF" aria-selected="true"></button>
  <button role="tab" id="tM" aria-selected="false"></button>
  <button role="tab" id="tP" aria-selected="false"></button>
</nav>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Fenêtre"><div class="sh" id="sh"></div></div>
<input type="file" accept="image/*" id="fx" hidden>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const later=(ms,fn)=>setTimeout(fn,ms);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e4?(n/1e3).toFixed(1).replace('.',',')+' k':Math.round(n).toLocaleString('fr-FR');
const ago=t=>{if(!t)return'';const m=Math.floor((Date.now()-t)/6e4);return m<1?'à l’instant':m<60?m+' min':m<1440?Math.floor(m/60)+' h':Math.floor(m/1440)+' j'};
const rich=t=>esc(t).replace(/(^|[^\w&#;])(@[A-Za-z0-9_.]*[A-Za-z0-9_]|#[\p{L}\d_]+)/gu,(m,a,b)=>a+`<span class="ln" data-h="${b}">${b}</span>`);
const shade=(h,f)=>{const n=parseInt(h.slice(1),16);return'#'+[n>>16,(n>>8)&255,n&255].map(x=>Math.round(clamp(x*f,0,255)).toString(16).padStart(2,'0')).join('')};
const inkOn=bg=>{if(!/^#[0-9a-f]{6}$/i.test(bg))return'var(--ink)';const n=parseInt(bg.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255>.62?'#111':'#fff'};

/* ---------- Icônes ---------- */
const ic=d=>`<svg viewBox='0 0 24 24'><path d='${d}'/></svg>`;
const I={re:ic('M4 5h16v11H9l-5 4z'),rt:ic('M4 9l3-3 3 3M7 6v9a3 3 0 003 3h6M20 15l-3 3-3-3M17 18V9a3 3 0 00-3-3H8'),h:ic('M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z'),v:ic('M5 20V10M12 20V4M19 20v-7'),
bk:ic('M15 5l-7 7 7 7'),pal:ic('M12 3a9 9 0 100 18c1.6 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 003-3c0-5-4.5-11-8-11zM7.5 11h.01M10 7.5h.01M14.5 7.5h.01'),
home:ic('M4 11l8-7 8 7v9h-5v-6H9v6H4z'),mail:ic('M3 6h18v12H3zM3 7l9 7 9-7'),user:ic('M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6'),
key:ic('M15 8h.01M21 8a6 6 0 11-11.6 2.1L3 16.5V21h4.5v-2.5H10V16h2.5l.9-.9A6 6 0 0121 8z'),gr:ic('M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'),us:ic('M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 000-6M21 20c0-2-1.5-4-4-4.6')};
I.tr=ic('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6');I.im=ic('M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M9 9h.01');

try{Object.assign(CFG,JSON.parse(localStorage.getItem('tweety_cfg')||'{}'))}catch(e){}
if(!PROV[CFG.p])CFG.p='gemini';
const saveCfg=()=>{try{localStorage.setItem('tweety_cfg',JSON.stringify(CFG))}catch(e){}};
function live(t,off){$('#liveTxt').textContent=t;$('#live').classList.toggle('off',!!off)}
const err=c=>{const e=new Error(c);e.code=c;return e};
async function llm(prompt,json){
  if(!CFG.k)throw err('nokey');
  const model=(CFG.m||PROV[CFG.p].m).trim();let res;
  try{
    if(CFG.p==='groq')res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.k},body:JSON.stringify(Object.assign({model,messages:[{role:'user',content:prompt}],temperature:1},json?{response_format:{type:'json_object'}}:{}))});
    else res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(CFG.k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:Object.assign({temperature:1},json?{responseMimeType:'application/json'}:{})})});
  }catch(x){throw err('network')}
  if(!res.ok)throw err(res.status===429?'rate_limited':[400,401,403].includes(res.status)?'bad_key':'http');
  const d=await res.json();
  const text=CFG.p==='groq'?(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content):(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts||[]).map(p=>p.text||'').join('');
  if(!text)throw err('empty');
  return text;
}
function parseJson(t){t=String(t).replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i)return JSON.parse(t.slice(i,j+1));throw err('empty')}}
const errMsg=e=>{const c=e&&e.code;return c==='rate_limited'?'Trop de requêtes, patiente un instant.':c==='bad_key'?'Clé API refusée. Vérifie la clé et le modèle.':c==='network'?'Connexion impossible.':'Réponse IA impossible pour le moment.'};
async function ai(prompt,quiet){
  if(!CFG.k){live('Ajoute ta clé API pour animer Tweety',1);if(!quiet){toast('Ajoute une clé API (icône clé en haut).');openKey()}return null}
  try{return parseJson(await llm(prompt,true))}
  catch(e){const c=e&&e.code;coolUntil=Date.now()+(c==='rate_limited'?45000:20000);
    if(c==='bad_key'){aiOff=true;live('Clé API refusée, vérifie-la',1)}
    if(!quiet||c==='bad_key')toast(errMsg(e));return null}
}
const roster=()=>all().map(c=>`${c.id}: ${c.n} (@${c.h}), ${persona(c)}`).join('\n');
const nameOf=w=>w==='me'?'Utilisateur':(byId(w)?byId(w).n:'?');
function feedCtx(){return S.posts.slice(0,8).map(p=>{const cm=p.cm.slice(-3).map(k=>'('+k.id+') '+nameOf(k.who)+': '+k.text).join(' | ');
  return`[${p.id}] ${p.who==='me'?'Utilisateur ('+S.me.name+', @'+S.me.handle+')':nameOf(p.who)}: ${p.text}${cm?' || commentaires: '+cm:''}`}).join('\n')}
function repCtx(){const mine=S.posts.filter(p=>p.who==='me').slice(0,3).map(p=>`"${p.text.slice(0,100)}"`).join(' ; ');
  return`Utilisateur du réseau: ${S.me.name} (@${S.me.handle}). Sa réputation actuelle: ${S.pop}/100 (${popInfo(S.pop).l}).`+(mine?` Ses dernières publications: ${mine}.`:'')}
const STYLE='ton réaliste d’un vrai réseau social français: spontané, familier, abréviations, ironie, opinions tranchées, parfois un emoji ou un hashtag, jamais un ton d’assistant. Respecte strictement le champ Style de chaque personnage: longueur, ponctuation, emojis et attitude doivent être très différents d’un personnage à l’autre.';

/* ---------- Monde vivant ---------- */
const Q={posts:[],cm:[]};let filling=false,lastFill=0;
async function fill(force){
  if(filling||aiOff||!CFG.k||(document.hidden&&!force))return;
  if(Date.now()<coolUntil||Date.now()-lastFill<20000)return;
  filling=true;lastFill=Date.now();
  const now=new Date().toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'});
  const r=await ai(`Réseau social fictif français. Personnages:\n${roster()}\n\nMoment: ${now}.\n${repCtx()}\n\nFil récent (identifiant entre crochets):\n${feedCtx()||'(vide)'}\n\nGénère l’activité du réseau, avec un ${STYLE}\n- "posts": 4 nouvelles publications courtes (max 220 caractères) de personnages différents. Elles peuvent parler de leur vie, de l’actualité du réseau, de publications du fil, ou de l’utilisateur selon sa réputation (mal vu: on le critique ou on s’en moque; apprécié: on le salue). Ajoute un champ "img" (une clé parmi ${Object.keys(BN).join(', ')}) à environ 1 publication sur 3, quand une photo irait avec le texte.\n- "comments": 5 commentaires courts sur des publications du fil (champ "post" = identifiant exact entre crochets), de personnages différents. Ils peuvent se répondre entre eux (champ "re" = identifiant entre parenthèses du commentaire auquel ils répondent) ou répondre à l’utilisateur.\nRéponds uniquement par un JSON: {"posts":[{"who":"id","text":"...","img":"clé ou omis"}],"comments":[{"post":"id","who":"id","text":"...","re":"id ou omis"}]}`,true);
  filling=false;
  if(r&&typeof r==='object'){
    (r.posts||[]).forEach(x=>{if(x&&byId(x.who)&&x.text)Q.posts.push({who:x.who,text:String(x.text).slice(0,260),img:x.img})});
    (r.comments||[]).forEach(x=>{if(x&&x.post&&byId(x.who)&&x.text)Q.cm.push({post:x.post,who:x.who,text:String(x.text).slice(0,200),re:x.re})});
    live('En direct');
    if(S.posts.length<4)for(let i=0;i<3;i++)later(i*900,dripPost);
  }
}
function insertPost(p){
  if(view!=='F')return;if(tagF){tagF=null;renderFeed();return}const f=$('#feed'),em=f.querySelector('.empty');if(em)em.remove();
  const before=document.documentElement.scrollHeight;
  f.insertAdjacentHTML('afterbegin',postHTML(p,'new'));
  if(scrollY>160)scrollBy(0,document.documentElement.scrollHeight-before);
}
function addPost(who,text,img){
  const c=byId(who);if(!c)return;
  const p={id:uid(),who,text,t:Date.now(),likes:rand(20)+(c.f>20000?rand(120):0),liked:false,cm:[],rt:rand(4)};const ik=BN[img]?img:(rand(10)<2?c.bn:'');if(ik){p.ik=ik;p.hue=rand(70)-35;p.pos=rand(100)}
  S.posts.unshift(p);if(S.posts.length>120)S.posts.length=120;save();insertPost(p);
}
const rootOf=(p,id)=>{const k=p.cm.find(z=>z.id===id);return k?(k.re&&p.cm.some(z=>z.id===k.re)?k.re:k.id):null};
function addCm(p,who,text,re){const c=byId(who);if(!c)return;
  const rid=re&&rootOf(p,re),par=rid&&p.cm.find(z=>z.id===re);
  if(par&&!/^@/.test(text)){const a=authorOf(par.who);if(a)text='@'+a.h+' '+text}
  const k={id:cid(),who,text,t:Date.now(),likes:rand(3)};if(rid)k.re=rid;
  p.cm.push(k);p.likes+=rand(3);save();touch(p);
  if(view==='D'&&curPost===p.id)renderCm(p);
  if(p.who==='me'||(par&&par.who==='me'))toast(c.n+(par&&par.who==='me'?' t’a répondu':' a commenté ta publication'));
}
function dripPost(){const x=Q.posts.shift();if(x)addPost(x.who,x.text,x.img);if(Q.posts.length<2)fill()}
function dripCm(){let n=Q.cm.length;while(n--){const x=Q.cm.shift(),p=S.posts.find(q=>q.id===x.post);if(p&&byId(x.who)){addCm(p,x.who,x.text,x.re);break}}if(Q.cm.length<3)fill()}
function ambientLike(){
  if(!S.posts.length)return;const p=S.posts[Math.min(rand(S.posts.length),rand(S.posts.length))];
  if(p.tone<0&&rand(3))return;p.likes+=1+rand(3);if(rand(4)===0)p.rt=(p.rt||0)+1;if(p.cm.length&&rand(3)===0){pick(p.cm).likes=(pick(p.cm).likes||0)+1;if(view==='D'&&curPost===p.id)renderCm(p)}save();touch(p)}
function startWorld(){
  const lp=(fn,min,span)=>{const g=()=>later(min+Math.random()*span,()=>{if(!document.hidden)fn();g()});g()};
  lp(dripPost,4000,11000);lp(dripCm,3000,7000);lp(ambientLike,1800,3200);
  setInterval(()=>document.querySelectorAll('.ago').forEach(e=>e.textContent=ago(+e.dataset.t)),30000);
  later(600,()=>fill(true));
}

/* ---------- Popularité ---------- */
function renderPop(){
  const i=popInfo(S.pop),c=$('#popChip');c.style.setProperty('--c',i.c);$('#popTxt').textContent=S.pop;const bb=$('#pbi');bb.style.width=S.pop+'%';bb.style.background=i.c;
  c.setAttribute('aria-label','Popularité '+S.pop+' sur 100, '+i.l);
  if(view==='U'&&curProf==='me')renderProfile();
}
function popChange(tone,why,snip){
  tone=+tone||0;
  const d=[-14,-6,rand(3)-1,5,11][tone+2]+(tone?rand(3)-1:0),old=S.pop;S.pop=clamp(S.pop+d,0,100);const real=S.pop-old;
  S.me.followers=Math.max(0,S.me.followers+Math.round(d*(1+S.me.followers*.004)));
  S.log.unshift({t:Date.now(),d:real,why:String(why||'').slice(0,60),sn:String(snip||'').slice(0,50)});S.log=S.log.slice(0,10);
  save();renderPop();
  const c=$('#popChip');c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');
  if(real)toast('Popularité '+(real>0?'+':real<0?'−':'')+Math.abs(real)+(why?' · '+why:''));
}
function bumpLikes(p,total){const n=3+rand(3);for(let i=1;i<=n;i++)later(i*(1500+rand(2500)),()=>{p.likes+=Math.max(0,Math.round(total/n));save();touch(p)})}
async function reactUser(kind,text,p,o){o=o||{};
  const thread=p.cm.slice(-6).map(k=>'('+k.id+') '+nameOf(k.who)+': '+k.text).join('\n');
  const what=kind==='post'?`L’utilisateur vient de publier: "${text}"${p.img?' (avec une photo jointe)':''}`:`Sous la publication de ${p.who==='me'?'l’utilisateur':nameOf(p.who)} ("${p.text.slice(0,140)}"), l’utilisateur vient de commenter: "${text}"`;
  const rep=o.to&&o.to!=='me'&&byId(o.to)?`\nL’utilisateur répond directement à ${nameOf(o.to)}: ce personnage doit répondre en premier.`:'';
  let r=await ai(`Réseau social fictif français. Personnages:\n${roster()}\n\n${repCtx()}\n\n${what}${rep}\nCommentaires déjà présents:\n${thread||'(aucun)'}\n\nFais réagir le réseau avec un ${STYLE}\n1) "tone": entier de -2 à 2 pour ce que dit l’utilisateur (-2 insultant, haineux ou très méchant; -1 désagréable, arrogant, méprisant; 0 banal ou neutre; 1 sympa, positif; 2 très gentil, généreux, inspirant). "reason": 3 à 6 mots expliquant le ton.\n2) "comments": 3 à 5 commentaires courts de personnages différents sur la publication ${kind==='post'?'':'(réponses au commentaire ou à ce qui se dit)'}. Si tone<0: ils se plaignent, critiquent ou se moquent selon leur personnalité. Si tone>0: ils félicitent, soutiennent, remercient. Si tone=0: réactions variées.\n3) "posts": ${kind==='post'?'1 à 3':'0 à 1'} publications personnelles de personnages qui parlent de ce que l’utilisateur vient de dire (se plaindre sur leur propre compte si tone<0, le saluer si tone>0, vide si tone=0), pouvant citer @${S.me.handle}.\nRéponds uniquement par un JSON: {"tone":0,"reason":"...","comments":[{"who":"id","text":"...","re":"u si ça répond à l’utilisateur, ou id d’un commentaire, sinon omis"}],"posts":[{"who":"id","text":"...","img":"clé ou omis"}]}`);
  if(!r||typeof r!=='object')r={};
  let tone=clamp(Math.round(+r.tone||0),-2,2);if(!tone)tone=localTone(text);
  if(kind==='post')p.tone=tone;
  later(1800,()=>popChange(tone,r.reason||(tone?'Réaction du réseau':''),text));
  const lk=tone>=1?8+rand(25):tone===0?2+rand(10):tone===-1?rand(4):rand(2);if(kind==='post')bumpLikes(p,Math.round(lk*(.5+S.pop/100)));
  let t=1500;(r.comments||[]).forEach(k=>{if(k&&byId(k.who)&&k.text){t+=1800+rand(3500);const x=k;later(t,()=>addCm(p,x.who,String(x.text).slice(0,200),x.re==='u'?(o.k&&o.k.id):x.re))}});
  let u=6000;(r.posts||[]).forEach(k=>{if(k&&byId(k.who)&&k.text){u+=4000+rand(6000);const x=k;later(u,()=>addPost(x.who,String(x.text).slice(0,260),x.img))}});
}

function prevHTML(p){return p.cm.slice(-2).map(k=>{const a=authorOf(k.who);return a?`<div><span class="who" data-prof="${esc(a.id)}">${esc(a.n)}</span> ${rich(k.text)}</div>`:''}).join('')+(p.cm.length>2?`<div class="hd">Voir les ${p.cm.length} commentaires</div>`:'')}

function renderFeed(){const L=tagF?S.posts.filter(p=>p.text.toLowerCase().includes(tagF.toLowerCase())):S.posts;
  const html=(tagF?`<div class="live"><span style="flex:1">Filtre : <span class="ln">${esc(tagF)}</span></span><button class="btn ghost sm" data-x="untag">Effacer</button></div>`:'')+L.map(p=>postHTML(p)).join('');
  $('#feed').innerHTML=html||'<div class="empty">Le fil se remplit dans quelques secondes.</div>'}
function touch(p){document.querySelectorAll(`[data-id="${p.id}"]`).forEach(el=>{
  const s=(k,v)=>{const n=el.querySelector('.k-'+k);if(n)n.textContent=v};

function renderStories(){$('#stories').innerHTML=all().map(c=>`<button class="st" data-prof="${esc(c.id)}"><span class="ring">${avh(c,'l',1)}</span><span>${esc(c.n.split(' ')[0])}</span></button>`).join('')}
let ub=false;
function prevImg(){$('#cpv').innerHTML=pimg?`<div class="cpv"><img src="${pimg}" alt=""><button class="btn ghost sm" data-x="rpimg">Retirer</button></div>`:''}

  if(isMe){
    const pi=popInfo(S.pop);
    h+=`<div class="acts2"><button class="btn ghost" data-x="edit">Modifier le profil</button><button class="btn ghost" data-x="newch">Créer un personnage</button></div>
    <div class="rep"><div class="rh"><b>Popularité</b><span style="color:${pi.c};font-weight:700">${S.pop}/100 · ${pi.l}</span></div><div class="meter"><i style="left:${S.pop}%"></i></div><div class="hd">Les personnages jugent ce que tu publies et commentes. Être aimable monte la jauge, être méchant la fait chuter.</div>${S.log.length?`<div class="log">${S.log.slice(0,4).map(l=>`<div><b class="${l.d>0?'up':'dn'}">${l.d>0?'+':l.d<0?'−':''}${Math.abs(l.d)}</b> ${esc(l.why)} · « ${esc(l.sn)} »</div>`).join('')}</div>`:''}</div>`;
  }else{
    const f=!!S.fl[c.id],ov=S.over[c.id]||S.ob[c.id];
    h+=`<div class="acts2"><button class="btn ${f?'ghost':''}" data-x="follow" data-v="${esc(c.id)}">${f?'Abonné':'Suivre'}</button><button class="btn ghost" data-x="dm" data-v="${esc(c.id)}">Écrire</button></div><div class="acts2"><button class="btn ghost sm" data-x="chpho" data-v="${esc(c.id)}">Changer la photo</button><button class="btn ghost sm" data-x="chban" data-v="${esc(c.id)}">Changer la bannière</button>${ov?`<button class="btn ghost sm" data-x="chreset" data-v="${esc(c.id)}">Réinitialiser</button>`:''}</div>`;
  }
  if(!isMe)tabP='posts';
  h+=`<div class="tabs" role="tablist"><button role="tab" data-x="tab" data-v="posts" aria-selected="${tabP==='posts'}">${I.gr}Publications</button>${isMe?`<button role="tab" data-x="tab" data-v="chars" aria-selected="${tabP==='chars'}">${I.us}Personnages</button>`:''}</div>`;
  if(tabP==='chars'&&isMe){
    h+=all().map(k=>`<div class="mine">${avh(k,'')}<div class="mi"><b>${esc(k.n)}</b><div class="hd">@${esc(k.h)} · ${fmt(k.f)} abonnés</div></div><button class="btn ghost sm" data-prof="${esc(k.id)}">Voir</button>${k.id[0]==='c'&&!CH.some(z=>z.id===k.id)?`<button class="btn ghost sm" data-x="delch" data-v="${esc(k.id)}">Supprimer</button>`:''}</div>`).join('');
  }else{
    h+=posts.length?posts.map(p=>postHTML(p)).join(''):`<div class="empty">Aucune publication pour l’instant.</div>`;
  }
  $('#vU').innerHTML=h;
}

/* ---------- Fenêtres de modification ---------- */
let D=null,N=null;
function openSheet(h){$('#sh').innerHTML=h;$('#ov').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('#ov').hidden=true;$('#sh').innerHTML='';document.body.style.overflow='';D=null;N=null}
function redo(fn){const y=$('#sh').scrollTop;$('#sh').innerHTML=fn();$('#sh').scrollTop=y}
function chooseImg(w,h,cb){const i=$('#fx');i.value='';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{cb(await readImg(f,w,h))}catch(e){toast('Image illisible.')}};i.click()}
function readImg(f,w,h,q){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.max(w/i.width,h/i.height),sw=w/k,sh=h/k,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,0,0,w,h);ok(c.toDataURL('image/jpeg',q||.82))};i.src=r.result};r.readAsDataURL(f)})}
function editHTML(){return`<div class="shd"><button class="btn ghost sm" data-x="close">Annuler</button><b>Modifier le profil</b><button class="btn sm" data-x="save">Enregistrer</button></div>
<div class="ban">${D.banner?`<img src="${esc(D.banner)}" alt="">`:''}</div>
<div class="ed-row">${avh(toC(D),'xl',1)}<div class="ed-btns"><button class="btn ghost sm" data-x="dpho">Changer la photo</button>${D.photo?'<button class="btn ghost sm" data-x="rpho">Retirer</button>':''}<button class="btn ghost sm" data-x="dban">Changer la bannière</button>${D.banner?'<button class="btn ghost sm" data-x="rban">Retirer</button>':''}</div></div>
<div class="sb"><label class="fld">Nom<input type="text" id="eName" maxlength="30" value="${esc(D.name)}"></label>
<label class="fld">Identifiant<input type="text" id="eHandle" maxlength="20" value="${esc(D.handle)}"></label>
<label class="fld">Bio<textarea id="eBio" rows="3" maxlength="150">${esc(D.bio)}</textarea></label>
<label class="fld">Abonnés (fictif)<input type="text" inputmode="numeric" id="eFol" value="${esc(D.followers)}"></label>
<label class="fld">Couleur de l’avatar sans photo<input type="color" id="eColor" value="${esc(/^#[0-9a-f]{6}$/i.test(D.color)?D.color:'#6b7a90')}"></label></div>`}
function syncD(){if(D&&$('#eName')){D.name=$('#eName').value;D.handle=$('#eHandle').value.replace(/[^a-zA-Z0-9_.]/g,'');D.bio=$('#eBio').value;D.followers=$('#eFol').value;D.color=$('#eColor').value}}
function saveEdit(){syncD();S.me=Object.assign({},D,{name:D.name.trim()||'Toi',handle:D.handle||'moi',bio:D.bio.trim(),followers:Math.max(0,parseInt(D.followers)||0)});save();closeSheet();refresh();renderPop()}
function newHTML(){return`<div class="shd"><button class="btn ghost sm" data-x="close">Annuler</button><b>Nouveau personnage</b><button class="btn sm" data-x="mkch">Créer</button></div>
<div class="ban">${N.ban?`<img src="${esc(N.ban)}" alt="">`:''}</div>
<div class="ed-row">${avh({id:'me',n:N.n||'?',p:N.p,color:'#6b7a90'},'xl',1)}<div class="ed-btns"><button class="btn ghost sm" data-x="npho">Photo</button><button class="btn ghost sm" data-x="nban">Bannière</button></div></div>
<div class="sb"><label class="fld">Nom<input type="text" id="nName" maxlength="30" value="${esc(N.n)}"></label>
<label class="fld">Identifiant<input type="text" id="nHandle" maxlength="20" value="${esc(N.h)}"></label>
<label class="fld">Personnalité (comment il parle, ce qu’il aime)<textarea id="nBio" rows="3" maxlength="300">${esc(N.b)}</textarea></label>
<label class="fld">Abonnés<input type="text" inputmode="numeric" id="nFol" placeholder="1000" value="${esc(N.f)}"></label>
<div class="hd">Sans photo, un portrait est généré automatiquement.</div></div>`}
function syncN(){if(N&&$('#nName')){N.n=$('#nName').value;N.h=$('#nHandle').value;N.b=$('#nBio').value;N.f=$('#nFol').value}}
function makeChar(){syncN();const n=N.n.trim(),b=N.b.trim();if(!n||!b){toast('Ajoute un nom et une personnalité.');return}
  const h=(N.h.trim()||n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_.]/g,'')||'perso';
  S.chars.push({id:'c'+uid(),n,h,b,pb:b.slice(0,120),f:Math.max(0,parseInt(N.f)||(300+rand(5000))),g:60+rand(500),s:randomAv(),p:N.p,pban:N.ban,bn:pick(Object.keys(BN))});
  save();closeSheet();refresh();toast(n+' a rejoint le réseau.')}

/* ---------- Clé API ---------- */
let KD=null;
function keyHTML(){const pv=PROV[KD.p];
  return`<div class="shd"><button class="btn ghost sm" data-x="close">Fermer</button><b>Clé API gratuite</b><button class="btn sm" data-x="savekey">Enregistrer</button></div><div class="sb"><p class="hd">Tweety fonctionne sans Claude: les personnages sont animés par le modèle de ton choix, avec ta propre clé gratuite. La clé reste dans ce navigateur et n’est envoyée qu’au fournisseur choisi.</p>
<label class="fld">Fournisseur<select id="kProv">${Object.keys(PROV).map(k=>`<option value="${k}" ${k===KD.p?'selected':''}>${PROV[k].n}</option>`).join('')}</select></label>
<label class="fld">Clé API<input type="password" id="kKey" autocomplete="off" spellcheck="false" placeholder="Colle ta clé ici" value="${esc(KD.k)}"></label>
<label class="fld">Modèle<input type="text" id="kModel" spellcheck="false" value="${esc(KD.m||pv.m)}"></label>
<p class="hd">Obtenir une clé gratuite: <a href="${pv.u}" target="_blank" rel="noopener" style="color:var(--acc)">${pv.u.replace('https://','')}</a></p>
${CFG.k?'<button class="btn ghost sm" data-x="rmkey">Supprimer la clé</button>':''}</div>`}
function syncK(){if(KD&&$('#kKey')){KD.k=$('#kKey').value.trim();KD.m=$('#kModel').value.trim()}}
function openKey(){KD=Object.assign({},CFG);openSheet(keyHTML())}
function resetAi(){aiOff=false;coolUntil=0;lastFill=0;if(CFG.k){live('En direct');fill(true)}else live('Ajoute ta clé API pour animer Tweety',1)}
document.addEventListener('change',e=>{if(e.target.id==='kProv'){syncK();KD.p=e.target.value;KD.m='';redo(keyHTML)}});

/* ---------- Thèmes ---------- */
const TH=[['bleu','Bleu','#071225','#3b9cff'],['noir','Noir','#000000','#eff3f4'],['rose','Rose','#fff0f6','#e11d79'],['blanc','Blanc','#ffffff','#0f1419'],['jaune','Jaune','#fffbe6','#f2b705']];
function applyTheme(){document.documentElement.dataset.t=TH.some(t=>t[0]===S.me.theme)?S.me.theme:'bleu'}
function renderPal(){$('#pal').innerHTML='<div class="hd pt">Apparence</div>'+TH.map(t=>`<button class="sw" data-x="th" data-v="${t[0]}" aria-pressed="${S.me.theme===t[0]}"><span class="dot" style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></span>${t[1]}</button>`).join('')}

/* ---------- Messages privés ---------- */
let cur='lea',cb=false,dmOpen=false,dmFrom=false;
const lastDm=id=>(S.dms[id]||[]).filter(m=>m.text!=='…').slice(-1)[0];
function inbox(){const L=all().map(c=>({c,m:lastDm(c.id)})).sort((a,b)=>((b.m&&b.m.t)||0)-((a.m&&a.m.t)||0));
  $('#inbox').innerHTML=L.map(({c,m})=>`<button class="ct" data-dm="${esc(c.id)}">${avh(c,'',1)}<div class="mi"><div class="cn"><b>${esc(c.n)}</b>${c.v?BADGE:''}<span class="hd">@${esc(c.h)}</span></div><div class="hd cp">${m?(m.r==='me'?'Toi : ':'')+esc(m.text):'Nouvelle conversation'}</div></div>${m&&m.t?`<span class="hd">${ago(m.t)}</span>`:''}</button>`).join('')}
function renderM(){const o=dmOpen&&byId(cur);$('#inbox').hidden=!!o;$('#chatw').hidden=!o;$('#back').hidden=!o;
  $('#ttl').textContent=o?byId(cur).n:'Messages';if(o)msgs();else inbox()}
function msgs(){
  if(!byId(cur))cur='lea';const h=S.dms[cur]||[],c=byId(cur),box=$('#msgs');
  $('#chead').innerHTML=avh(c,'s')+`<div style="flex:1;min-width:0"><b>${esc(c.n)}</b>${c.v?BADGE:''}<div class="hd">@${esc(c.h)} · ${fmt(c.f||0)} abonnés</div></div><button class="btn ghost sm" data-x="cldm">Effacer</button>`;
  box.innerHTML=h.length?h.map(m=>`<div class="m ${m.r}">${esc(m.text)}</div>`).join(''):`<div class="empty">Écris à ${esc(c.n)} (@${esc(c.h)}). Aucune limite de messages.</div>`;
  box.scrollTop=box.scrollHeight;
}
async function chat(){
  const t=$('#mi').value.trim();if(!t||cb)return;
  if(!CFG.k){toast('Ajoute une clé API (icône clé en haut).');openKey();return}
  cb=true;$('#mb').disabled=true;$('#mi').value='';
  const id=cur,c=byId(id),h=S.dms[id]=S.dms[id]||[];
  h.push({r:'me',text:t,t:Date.now()});save();msgs();
  const ctx=h.slice(-40).map(m=>`${m.r==='me'?'Utilisateur':c.n}: ${m.text}`).join('\n');
  const prompt=`Tu es ${c.n} (@${c.h}), ${persona(c)}. Tu discutes en messages privés avec un utilisateur (${S.me.name}${S.me.bio?', '+S.me.bio:''}) sur un réseau social. Sa réputation sur le réseau est de ${S.pop}/100 (${popInfo(S.pop).l}): si elle est basse tu es froid ou méfiant, si elle est haute tu es chaleureux. Reste dans ton personnage, réponds en français comme sur un vrai réseau social: spontané, familier, abréviations et emojis parfois, 1 à 3 phrases, jamais un ton d’assistant, sans guillemets ni préfixe avec ton nom.\n\nConversation:\n${ctx}\n\nÉcris uniquement ta prochaine réponse.`;
  const m={r:'ai',text:'…',t:Date.now()};h.push(m);msgs();
  try{m.text=(await llm(prompt,false)).trim()||m.text;m.t=Date.now()}
  catch(e){h.pop();toast(errMsg(e))}
  save();if(view==='M')renderM();cb=false;$('#mb').disabled=false;
}
function arm(el,label,fn){
  if(!el.dataset.armed){const o=el.textContent;el.dataset.armed=1;el.textContent=label;later(3000,()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=o}});return}
  fn();
}

/* ---------- Navigation ---------- */
let view='F',curPost=null,curProf='me',stack=[];
function refresh(){renderStories();$('#meAv').innerHTML=avh(meObj(),'',1);
  if(view==='F')renderFeed();if(view==='U')renderProfile();if(view==='D')renderDetail();if(view==='M')renderM()}
function show(v,arg){
  view=v;if(v==='D')curPost=arg;if(v==='U')curProf=arg||'me';
  for(const k of['F','D','U','M'])$('#v'+k).hidden=k!==v;
  const me=v==='U'&&curProf==='me';
  $('#tF').setAttribute('aria-selected',v==='F');$('#tM').setAttribute('aria-selected',v==='M');$('#tP').setAttribute('aria-selected',me);
  $('#back').hidden=!(v==='D'||(v==='U'&&!me));
  if(v==='F'){$('#ttl').textContent='Tweety';renderFeed()}
  if(v==='D'){$('#ttl').textContent='Publication';renderDetail()}
  if(v==='U')renderProfile();
  if(v==='M')renderM();
}
function go(v,arg){stack.push({view,curPost,curProf,y:scrollY});show(v,arg);scrollTo(0,0)}
function back(){if(view==='M'&&dmOpen&&!dmFrom){dmOpen=false;renderM();scrollTo(0,0);return}
  const s=stack.pop();if(!s||s.view!=='M')dmOpen=false;if(!s){show('F');return}show(s.view,s.view==='D'?s.curPost:s.curProf);scrollTo(0,s.y||0)}
const tabTo=(v,a)=>{stack=[];show(v,a);scrollTo(0,0)};

function postAct(b){
  const art=b.closest('[data-id]'),p=S.posts.find(x=>x.id===art.dataset.id);if(!p)return;const a=b.dataset.pa;
  if(a==='del'){conf2(b,()=>{S.posts=S.posts.filter(x=>x.id!==p.id);Q.cm=Q.cm.filter(x=>x.post!==p.id);save();if(view==='D')back();else refresh()});return}
  if(a==='like'){p.liked=!p.liked;p.likes+=p.liked?1:-1;save();touch(p)}
  if(a==='rt'){p.rted=!p.rted;p.rt=Math.max(0,(p.rt||0)+(p.rted?1:-1));save();touch(p)}
  if(a==='cm'){if(view==='D'){const i=$('#cmIn');if(i)i.focus()}else{focusCm=true;go('D',p.id)}}
}
function act(n,el){const v=el.dataset.v;
  switch(n){
    case'edit':D=Object.assign({},S.me);openSheet(editHTML());break;
    case'close':closeSheet();break;
    case'save':saveEdit();break;
    case'dpho':syncD();chooseImg(192,192,u=>{D.photo=u;redo(editHTML)});break;
    case'rpho':syncD();D.photo='';redo(editHTML);break;
    case'dban':syncD();chooseImg(640,214,u=>{D.banner=u;redo(editHTML)});break;
    case'rban':syncD();D.banner='';redo(editHTML);break;
    case'newch':N={n:'',h:'',b:'',f:'',p:'',ban:''};openSheet(newHTML());break;
    case'npho':syncN();chooseImg(192,192,u=>{N.p=u;redo(newHTML)});break;
    case'nban':syncN();chooseImg(640,214,u=>{N.ban=u;redo(newHTML)});break;
    case'mkch':makeChar();break;
    case'delch':arm(el,'Confirmer ?',()=>{S.chars=S.chars.filter(c=>c.id!==v);S.posts=S.posts.filter(p=>p.who!==v);S.posts.forEach(p=>p.cm=p.cm.filter(k=>k.who!==v));delete S.dms[v];delete S.over[v];delete S.ob[v];if(cur===v)cur='lea';save();refresh()});break;
    case'follow':S.fl[v]=!S.fl[v];save();renderProfile();break;
    case'dm':cur=v;dmOpen=true;dmFrom=true;go('M');break;
    case'chpho':chooseImg(192,192,u=>{S.over[v]=u;save();refresh()});break;
    case'chban':chooseImg(640,214,u=>{S.ob[v]=u;save();refresh()});break;
    case'chreset':{delete S.over[v];delete S.ob[v];const k=S.chars.find(c=>c.id===v);if(k){k.p='';k.pban=''}save();refresh();break}
    case'tab':tabP=v;renderProfile();break;
    case'savekey':syncK();CFG={p:KD.p,k:KD.k,m:KD.m===PROV[KD.p].m?'':KD.m};saveCfg();closeSheet();if(CFG.k)toast('Clé enregistrée');resetAi();break;
    case'rmkey':CFG.k='';saveCfg();closeSheet();resetAi();break;
    case'cldm':arm(el,'Confirmer ?',()=>{S.dms[cur]=[];save();msgs()});break;
    case'rpimg':pimg='';prevImg();break;
    case'untag':tagF=null;renderFeed();break;
    case'norep':rt=null;$('#rto').hidden=true;$('#cmIn').value='';break;
    case'th':S.me.theme=v;applyTheme();renderPal();save();break;
  }
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='ov'){closeSheet();return}
  if(!t.closest('#pal')&&!t.closest('#palBtn'))$('#pal').hidden=true;
  const ln=t.closest('.ln');if(ln){const h=ln.dataset.h;if(h[0]==='@'){const n=h.slice(1).toLowerCase(),c=all().find(z=>z.h.toLowerCase()===n);if(c)go('U',c.id);else if(S.me.handle.toLowerCase()===n)go('U','me');else toast('Compte introuvable')}else{tagF=h;tabTo('F')}return}
  const x=t.closest('[data-x]');if(x){act(x.dataset.x,x);return}
  const dmb=t.closest('[data-dm]');if(dmb){cur=dmb.dataset.dm;dmOpen=true;dmFrom=false;renderM();scrollTo(0,0);return}
  const ka=t.closest('[data-ka]');if(ka){kAct(ka);return}
  const pa=t.closest('[data-pa]');if(pa){postAct(pa);return}
  const cmSend=t.closest('#cmSend');if(cmSend){sendCm();return}
  const pf=t.closest('[data-prof]');if(pf){if(!$('#ov').hidden)return;go('U',pf.dataset.prof);return}
  const o=t.closest('[data-open]');if(o){go('D',o.dataset.open);return}
  const art=t.closest('.post[data-id]');if(art){go('D',art.dataset.id)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();$('#pal').hidden=true}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cmIn'){e.preventDefault();sendCm()}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='mi'){e.preventDefault();chat()}
});
$('#back').onclick=back;
$('#popChip').onclick=()=>tabTo('U','me');
$('#keyBtn').onclick=openKey;
$('#palBtn').onclick=()=>{renderPal();$('#pal').hidden=!$('#pal').hidden};
$('#tF').onclick=()=>tabTo('F');$('#tM').onclick=()=>{dmOpen=false;tabTo('M')};$('#tP').onclick=()=>tabTo('U','me');
$('#pb').onclick=publish;$('#pimgb').innerHTML=I.im;$('#pimgb').onclick=()=>chooseImg(720,405,u=>{pimg=u;prevImg()});$('#mb').onclick=chat;

/* ---------- Démarrage ---------- */
$('#back').innerHTML=I.bk;$('#keyBtn').innerHTML=I.key;$('#palBtn').innerHTML=I.pal;
$('#tF').innerHTML=I.home+'Accueil';$('#tM').innerHTML=I.mail+'Messages';$('#tP').innerHTML=I.user+'Profil';
applyTheme();renderPal();renderStories();$('#meAv').innerHTML=avh(meObj(),'',1);
show('F');renderPop();startWorld();
if(!CFG.k){live('Ajoute ta clé API pour animer Tweety',1);later(500,openKey)}
</script>
</body></html>
