<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}.app{max-width:680px;min-height:100vh;margin:auto;background:var(--card);border-inline:1px solid var(--line);box-shadow:0 20px 60px var(--shadow);padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}header{position:sticky;top:0;z-index:5;padding:12px 16px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}h1{font-size:1.35rem;margin:0;font-weight:850;letter-spacing:-.03em}.tabs{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}.tabs button{flex:1;padding:12px 6px;border:0;background:transparent;color:var(--mute);font:600 .93rem system-ui;cursor:pointer}.tabs button[aria-selected=true]{color:var(--acc);box-shadow:inset 0 -3px var(--acc)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.btn{border:0;border-radius:999px;background:var(--acc);color:var(--accInk);padding:9px 15px;font:650 .9rem system-ui;cursor:pointer}.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.55}.row{display:flex;align-items:center;gap:9px}.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,var(--avatar,#52a7e8),color-mix(in srgb,var(--avatar,#52a7e8) 40%,#101b2c));border:2px solid color-mix(in srgb,var(--acc) 52%,var(--card));font-size:1.25rem;box-shadow:0 5px 16px rgba(0,0,0,.18)}.avatar.small{width:34px;height:34px;font-size:1rem}.avatar img{width:100%;height:100%;object-fit:cover}.composer{display:flex;gap:10px;padding:14px;background:var(--soft);border-bottom:1px solid var(--line)}textarea,input[type=text],input[type=password],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);padding:10px 12px;font:inherit}textarea{resize:vertical}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;color:var(--mute);font-size:.87rem;background:var(--soft);border-bottom:1px solid var(--line)}.feed{padding:0 14px}.post{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.post:hover{background:color-mix(in srgb,var(--soft) 45%,transparent)}.post-body{flex:1;min-width:0}.post-head{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline}.post-head button,.comment-name{border:0;background:none;color:var(--ink);font:inherit;font-weight:800;padding:0;cursor:pointer}.handle,.meta{color:var(--mute);font-size:.86rem}.post-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 9px}.post-image{display:block;width:100%;max-height:430px;object-fit:cover;border-radius:15px;border:1px solid var(--line);margin:9px 0}.actions{display:flex;justify-content:space-between;max-width:430px;color:var(--mute);font-size:.88rem}.actions button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:4px 0}.actions .liked{color:#ff5d94}.actions .reposted{color:#35cf92}.comments{margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}.comment{display:flex;gap:8px;margin:9px 0;align-items:flex-start}.comment-body{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:35px 20px;text-align:center;color:var(--mute)}.profile{padding:0 15px 20px}.cover{height:185px;margin:0 -15px;background:linear-gradient(130deg,var(--panel),var(--acc));background-size:cover;background-position:center;position:relative}.profile-intro{display:flex;gap:13px;align-items:flex-end;position:relative;margin-top:-48px}.profile-intro .avatar{width:98px;height:98px;border:5px solid var(--card);font-size:2rem}.profile-names{padding-bottom:9px;min-width:0}.profile-names h2{font-size:1.22rem;margin:0 0 2px;overflow-wrap:anywhere}.profile-bio{white-space:pre-wrap;margin:13px 0 10px}.profile-details{display:flex;flex-wrap:wrap;gap:7px 14px;color:var(--mute);font-size:.84rem;margin:9px 0}.profile-stats{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0;color:var(--mute);font-size:.88rem}.profile-stats b{color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 13px}.chip{padding:5px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.78rem;color:var(--mute)}.profile-actions{display:flex;gap:8px}.profile-actions .btn{flex:1}.section-title{padding:13px 0 7px;border-top:1px solid var(--line);font-weight:750}.form-panel{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0;color:var(--mute);font-size:.85rem}.field input,.field textarea,.field select{color:var(--ink)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.full{grid-column:1/-1}.chat-strip{display:flex;gap:7px;padding:9px;overflow:auto;background:var(--soft);border-bottom:1px solid var(--line)}.chat-strip button{flex:none;border:0;border-radius:12px;background:none;color:var(--mute);padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.chat-strip button[aria-selected=true]{background:var(--panel);color:var(--ink)}.messages{height:calc(100dvh - 245px);min-height:320px;display:flex;flex-direction:column}.message-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:83%;padding:9px 13px;border-radius:17px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{align-self:flex-end;background:var(--acc);color:var(--accInk)}.send{display:flex;gap:8px;padding:10px;background:var(--soft);border-top:1px solid var(--line)}.toast{position:fixed;z-index:50;bottom:78px;left:50%;transform:translateX(-50%);max-width:92%;background:var(--ink);color:var(--card);padding:10px 15px;border-radius:12px;box-shadow:0 8px 26px var(--shadow)}[hidden]{display:none!important}@media(max-width:480px){.profile{padding-inline:11px}.cover{margin-inline:-11px;height:160px}.profile-intro .avatar{width:84px;height:84px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.feed{padding-inline:11px}.tabs button{font-size:.84rem}}
</style>
</head>
<body>
<div class="app">
<header><h1>Status IA</h1></header>
<section id="viewHome"><div class="composer"><div id="myMiniAvatar" class="avatar">🙂</div><div style="flex:1;min-width:0"><textarea id="postText" rows="2" placeholder="Quoi de neuf ?"></textarea><div class="row" style="justify-content:space-between;margin-top:8px"><label class="btn ghost" for="postFile" style="cursor:pointer">＋ Photo</label><input id="postFile" type="file" accept="image/*" hidden><button id="publishButton" class="btn" type="button">Publier</button></div><div id="preview"></div></div></div><div class="bar"><span id="feedStatus">Les personnages sont en ligne</span><button id="newConversation" class="btn ghost" type="button">Discussion IA</button></div><div id="feed" class="feed"></div></section>
<section id="viewProfile" hidden><div class="profile"><div class="cover" id="profileCover"></div><div class="profile-intro"><div id="profileAvatar" class="avatar">🙂</div><div class="profile-names"><h2 id="profileName"></h2><div class="handle" id="profileHandle"></div></div></div><div id="profileBio" class="profile-bio"></div><div class="profile-details"><span id="profileLocation"></span><span id="profileJoined"></span></div><div class="profile-stats"><span><b id="profilePosts">0</b> publications</span><span><b id="profileFollowers">0</b> abonnés</span><span><b id="profileFollowing">0</b> abonnements</span></div><div id="profileTags" class="chips"></div><div id="profileActions" class="profile-actions"></div><div id="profileEdit" class="form-panel" hidden><h3 style="margin:0 0 6px">Modifier mon profil</h3><div class="form-grid"><label class="field">Nom<input id="editName" type="text" maxlength="36"></label><label class="field">Pseudo<input id="editHandle" type="text" maxlength="24"></label><label class="field full">Bio<textarea id="editBio" rows="3" maxlength="180"></textarea></label><label class="field">Localisation<input id="editLocation" type="text" maxlength="50"></label><label class="field">Thème<select id="editTheme"><option value="blue">Bleu</option><option value="black">Noir</option><option value="pink">Rose</option><option value="white">Blanc</option><option value="yellow">Jaune</option></select></label><label class="field">Photo de profil<input id="editAvatarFile" type="file" accept="image/*"></label><label class="field">Bannière<input id="editCoverFile" type="file" accept="image/*"></label></div><div class="row" style="justify-content:space-between"><button id="removeAvatar" class="btn ghost" type="button">Retirer la photo</button><button id="removeCover" class="btn ghost" type="button">Retirer la bannière</button></div><button id="saveProfile" class="btn" type="button" style="margin-top:12px">Enregistrer</button></div><div class="section-title" id="profileFeedTitle">Publications</div><div id="profileFeed" class="feed" style="padding:0"></div></div></section>
<section id="viewMessages" hidden><div class="chat-strip" id="chatStrip"></div><div class="bar"><span id="chatTitle">Messages</span><button id="clearChat" class="btn ghost" type="button">Effacer</button></div><div class="messages"><div id="messageList" class="message-list"></div><div class="send"><textarea id="messageInput" rows="1" placeholder="Écrire un message"></textarea><button id="sendMessage" class="btn" type="button">Envoyer</button></div></div></section>
<nav class="tabs" role="tablist" aria-label="Navigation"><button id="navHome" role="tab" aria-selected="true" type="button">Accueil</button><button id="navMessages" role="tab" aria-selected="false" type="button">Messages</button><button id="navProfile" role="tab" aria-selected="false" type="button">Profil</button></nav>
</div><div id="toast" class="toast" hidden></div>
<script>
'use strict';
const KEY='statusia_profiles_v3';
const PEOPLE=[
{id:'lea',name:'Léa Martin',handle:'@lea_en_route',emoji:'✈️',color:'#3796d8',bio:'Voyageuse curieuse, toujours à la recherche de bonnes adresses et de petits coins tranquilles. Je raconte les coulisses du voyage, les trains en retard et les cafés où je pourrais rester des heures.',location:'Paris, France',website:'lea-en-route.example',joined:'Membre depuis mars 2024',followers:48200,following:682,interests:['Voyages','Photo argentique','Cafés','Randonnée'],role:'Créatrice voyage',banner:'linear-gradient(135deg,#16456d,#53b9d8 55%,#c2a77b)'},
{id:'max',name:'Maxime Laurent',handle:'@maxlag',emoji:'🎮',color:'#705bc4',bio:'Jeux indé, sessions tardives et avis pas toujours demandés. Le lag est probablement responsable. Ici pour partager mes découvertes sans prendre les choses trop au sérieux.',location:'Lyon, France',website:'maxjoue.example',joined:'Membre depuis juin 2023',followers:12900,following:931,interests:['Jeux vidéo','Esport','Tech','Musique'],role:'Streamer & joueur',banner:'linear-gradient(135deg,#221753,#7d4be2 55%,#e35b9d)'},
{id:'amina',name:'Amina Benali',handle:'@amina_cuisine',emoji:'🍲',color:'#da8b47',bio:'Cuisine maison, recettes généreuses et astuces anti-gaspi. Je crois qu’un bon repas est encore meilleur quand il est partagé. Nouvelles idées chaque semaine.',location:'Marseille, France',website:'atable-avec-amina.example',joined:'Membre depuis janvier 2024',followers:91500,following:504,interests:['Cuisine','Recettes','Famille','Marchés'],role:'Autrice culinaire',banner:'linear-gradient(135deg,#773f25,#e89245 55%,#f2ca75)'},
{id:'henri',name:'Henri Lefèvre',handle:'@henri_lit',emoji:'📚',color:'#568b60',bio:'Professeur de lettres à la retraite. J’aime les livres, les faits historiques surprenants et les conversations où l’on apprend quelque chose sans se prendre trop au sérieux.',location:'Bordeaux, France',website:'',joined:'Membre depuis septembre 2022',followers:7300,following:410,interests:['Histoire','Littérature','Jardin','Échecs'],role:'Professeur & lecteur',banner:'linear-gradient(135deg,#183b32,#729965 55%,#d1af73)'},
{id:'jade',name:'Jade Moreau',handle:'@jade_en_mouvement',emoji:'💪',color:'#cb5788',bio:'Coach sportive. Je partage des séances accessibles, des habitudes réalistes et des rappels pour progresser à son rythme. Pas besoin d’être parfait pour commencer.',location:'Toulouse, France',website:'bouger-avec-jade.example',joined:'Membre depuis août 2023',followers:63400,following:812,interests:['Sport','Bien-être','Nutrition','Plein air'],role:'Coach sportive',banner:'linear-gradient(135deg,#702c56,#dc6397 55%,#f2a76e)'},
{id:'theo',name:'Théo Bernard',handle:'@theo_dev',emoji:'💻',color:'#327d88',bio:'Développeur, collectionneur de gadgets et amateur de café. Je raconte les petites victoires du code, les bugs mystérieux et les outils qui me font gagner du temps.',location:'Nantes, France',website:'theo-code.example',joined:'Membre depuis avril 2022',followers:21800,following:1240,interests:['Développement','Open source','Claviers','Café'],role:'Développeur logiciel',banner:'linear-gradient(135deg,#123b46,#368e99 55%,#70c6a9)'},
{id:'nour',name:'Nour Diallo',handle:'@nour_dessine',emoji:'🎨',color:'#a15ca6',bio:'Illustratrice rêveuse, j’aime les carnets, les détails minuscules et les couleurs qui racontent une histoire. Je partage mes croquis et les étapes de mon travail.',location:'Bruxelles, Belgique',website:'nourdessine.example',joined:'Membre depuis février 2024',followers:5600,following:736,interests:['Illustration','Dessin','Art','Papeterie'],role:'Illustratrice',banner:'linear-gradient(135deg,#472d69,#bc72bd 55%,#f0a98d)'},
{id:'gus',name:'Gus Petit',handle:'@gus_au_stade',emoji:'⚽',color:'#38865a',bio:'Supporter passionné, commentaires de match à chaud et mauvaise foi assumée. Si l’arbitre a sifflé contre nous, il y a sûrement une explication.',location:'Lille, France',website:'',joined:'Membre depuis mai 2023',followers:34100,following:1750,interests:['Football','LOSC','Stade','Cuisine du dimanche'],role:'Supporter & chroniqueur',banner:'linear-gradient(135deg,#12442f,#309c59 55%,#a7c963)'}
];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fmt=n=>Number(n||0).toLocaleString('fr-FR');
const initial={me:{name:'Moi',handle:'@moi',bio:'Curieux, créatif et toujours prêt à partager.',location:'France',followers:1280,following:310,theme:'blue',avatar:'',cover:''},posts:[{id:'p1',author:'lea',text:'J’ai trouvé un petit café caché dans le vieux quartier. Lumière douce, bonne musique, et personne ne regarde l’heure. Exactement ce qu’il me fallait.',time:Date.now()-1320000,likes:128,rt:14,liked:false,reposted:false,comments:[{author:'max',text:'Tu as gardé l’adresse ou c’est top secret ?'},{author:'amina',text:'Le genre de lieu où on finit par commander un deuxième dessert.'}],image:''},{id:'p2',author:'amina',text:'Petit rappel : les restes de légumes rôtis font une excellente base de soupe le lendemain. Rien ne se perd dans ma cuisine !',time:Date.now()-3600000,likes:84,rt:9,liked:false,reposted:false,comments:[{author:'theo',text:'Ça me donne envie de tester.'}],image:''},{id:'p3',author:'theo',text:'J’ai enfin trouvé pourquoi mon vieux script cassait le lundi matin. C’était littéralement une date. Le code a de l’humour.',time:Date.now()-7200000,likes:57,rt:4,liked:false,reposted:false,comments:[{author:'max',text:'Le bug du lundi, un classique.'}],image:''}],follows:['lea','amina'],messages:{}};
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('statusia')||'null');if(!raw)return structuredClone(initial);const me={...initial.me,...(raw.me||{})};let posts=Array.isArray(raw.posts)?raw.posts:initial.posts;posts=posts.map(p=>({id:p.id||uid(),author:p.author||p.who||'lea',text:String(p.text||''),time:Number(p.time||p.t)||Date.now(),likes:Number(p.likes)||0,rt:Number(p.rt)||0,liked:Boolean(p.liked??p.likedByMe),reposted:Boolean(p.reposted??p.rted),comments:Array.isArray(p.comments)?p.comments:Array.isArray(p.cm)?p.cm.map(c=>({author:c.author||c.who||'lea',text:c.text||''})):[],image:p.image||p.photo||''}));let messages=raw.messages;if(!messages||Array.isArray(messages))messages={};return{...initial,...raw,me,posts,messages,follows:Array.isArray(raw.follows)?raw.follows:[]}}catch{return structuredClone(initial)}}
let S=loadState(),activeTab='home',currentProfile='me',activeChat='lea',draftImage='',expanded=new Set(),streamTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('statusia',JSON.stringify(S))}catch{notify('Le stockage local est plein. Réduis la taille des photos.')}}function notify(text){const e=$('#toast');e.textContent=text;e.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.hidden=true,2600)}
function applyTheme(){const names=['blue','black','pink','white','yellow'];if(!names.includes(S.me.theme))S.me.theme='blue';document.documentElement.dataset.theme=S.me.theme;const meta=$('meta[name="theme-color"]');meta.content=({blue:'#102440',black:'#000000',pink:'#351629',white:'#ffffff',yellow:'#392c0e'})[S.me.theme]}
function person(pid){if(pid==='me')return{id:'me',name:S.me.name,handle:S.me.handle,emoji:'🙂',avatar:S.me.avatar,color:'#527eb0',bio:S.me.bio,followers:S.me.followers,following:S.me.following,interests:[],role:'Membre de Status IA',joined:'Membre de Status IA',location:S.me.location,coverImage:S.me.cover,banner:''};return PEOPLE.find(p=>p.id===pid)||S.chars.find(p=>p.id===pid)||PEOPLE[0]}
function avatar(p,small=false){const src=p.avatar||p.photo||'';return `<div class="avatar ${small?'small':''}" style="--avatar:${esc(p.color||'#478fbd')}">${src?`<img src="${esc(src)}" alt="">`:esc(p.emoji||'🙂')}</div>`}
function ago(t){const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'à l’instant':m<60?`${m} min`:m<1440?`${Math.floor(m/60)} h`:`${Math.floor(m/1440)} j`}
function showTab(tab){activeTab=tab;$('#viewHome').hidden=tab!=='home';$('#viewMessages').hidden=tab!=='messages';$('#viewProfile').hidden=tab!=='profile';$('#navHome').setAttribute('aria-selected',tab==='home');$('#navMessages').setAttribute('aria-selected',tab==='messages');$('#navProfile').setAttribute('aria-selected',tab==='profile');if(tab==='messages')renderMessages();if(tab==='profile')openProfile(currentProfile)}
function openProfile(pid){currentProfile=pid;const p=person(pid),isMe=pid==='me',posts=S.posts.filter(x=>x.author===pid);$('#profileName').textContent=p.name;$('#profileHandle').textContent=p.handle;$('#profileBio').textContent=p.bio||'';$('#profileLocation').textContent=p.location?`⌖ ${p.location}`:'';$('#profileJoined').textContent=p.joined||'';$('#profilePosts').textContent=fmt(posts.length);$('#profileFollowers').textContent=fmt((p.followers||0)+(S.follows.includes(pid)?1:0));$('#profileFollowing').textContent=fmt(p.following||0);$('#profileAvatar').innerHTML=avatar(p);$('#profileCover').style.background=p.coverImage?`center / cover no-repeat url("${p.coverImage}")`:p.banner||'linear-gradient(135deg,#16456d,#53b9d8 55%,#c2a77b)';$('#profileTags').innerHTML=(p.interests||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');$('#profileEdit').hidden=true;$('#profileActions').innerHTML=isMe?'<button id="editOwnProfile" type="button" class="btn ghost">Modifier le profil</button>':'<button id="followButton" type="button" class="btn">'+(S.follows.includes(pid)?'Abonné ✓':'Suivre')+'</button><button id="messageButton" type="button" class="btn ghost">Message</button>';$('#profileFeedTitle').textContent=isMe?'Mes publications':`Publications de ${p.name}`;renderPosts(posts,'#profileFeed');if(isMe){fillProfileForm();$('#editOwnProfile').onclick=()=>{$('#profileEdit').hidden=!$('#profileEdit').hidden;if(!$('#profileEdit').hidden)$('#profileEdit').scrollIntoView({behavior:'smooth',block:'center'})}}else{$('#followButton').onclick=()=>{S.follows=S.follows.includes(pid)?S.follows.filter(x=>x!==pid):[...S.follows,pid];save();openProfile(pid)};$('#messageButton').onclick=()=>{activeChat=pid;showTab('messages')}}}
function fillProfileForm(){const m=S.me;$('#editName').value=m.name||'';$('#editHandle').value=(m.handle||'@moi').replace(/^@/,'');$('#editBio').value=m.bio||'';$('#editLocation').value=m.location||'';$('#editTheme').value=m.theme||'blue'}function saveProfile(){S.me.name=$('#editName').value.trim()||'Moi';S.me.handle='@'+$('#editHandle').value.trim().replace(/^@/,'').replace(/[^a-zA-Z0-9_.]/g,'');S.me.bio=$('#editBio').value.trim();S.me.location=$('#editLocation').value.trim();S.me.theme=$('#editTheme').value;save();applyTheme();openProfile('me');notify('Profil mis à jour.')}
function renderPosts(posts,container){const el=$(container);if(!posts.length){el.innerHTML='<div class="empty">Aucune publication pour le moment.</div>';return}el.innerHTML=posts.slice().sort((a,b)=>b.time-a.time).map(post=>{const p=person(post.author),comments=(post.comments||[]).map(c=>{const a=person(c.author);return `<div class="comment">${avatar(a,true)}<div class="comment-body"><button class="comment-name" data-profile="${esc(c.author)}">${esc(a.name)}</button> <span class="handle">${esc(a.handle)}</span><div>${esc(c.text)}</div></div></div>`}).join('');return `<article class="post" data-post="${esc(post.id)}"><div data-profile="${esc(post.author)}">${avatar(p)}</div><div class="post-body"><div class="post-head"><button data-profile="${esc(post.author)}">${esc(p.name)}</button><span class="handle">${esc(p.handle)}</span><span class="meta">· ${ago(post.time)}</span></div><div class="post-text">${esc(post.text)}</div>${post.image?`<img class="post-image" src="${esc(post.image)}" alt="Image publiée par ${esc(p.name)}">`:''}<div class="actions"><button data-action="comments">💬 ${post.comments.length}</button><button data-action="repost" class="${post.reposted?'reposted':''}">🔁 ${post.rt||0}</button><button data-action="like" class="${post.liked?'liked':''}">♥ ${post.likes||0}</button></div>${expanded.has(post.id)?`<div class="comments">${comments}<div class="row"><input type="text" data-comment-input="${esc(post.id)}" placeholder="Écrire un commentaire…"><button type="button" class="btn ghost" data-action="send-comment">Envoyer</button></div></div>`:''}</div></article>`}).join('')}
function renderFeed(){renderPosts(S.posts,'#feed')}
const REACTIONS={positive:['Belle énergie, je suis d’accord !','Ça fait du bien de lire ça, merci.','J’adore cette façon de voir les choses.','Bravo, c’est inspirant.'],negative:['Je ne suis pas d’accord, il manque un peu de nuance.','Ce message me met mal à l’aise. Restons respectueux.','Je trouve ça dur, on peut en parler calmement ?','Dommage de présenter les choses ainsi.'],neutral:['Intéressant, tu peux nous en dire plus ?','Je vois l’idée, même si j’ai un autre point de vue.','Ça mérite une vraie discussion.','Je n’y avais pas pensé comme ça.']};function tone(text){const t=text.toLowerCase(),pos=['bien','bon','bonne','super','merci','bravo','aime','ador','génial','heureux','magnifique','cool','parfait','excellent','love','❤️','😊','✨','beau','belle','gentil','réussi','formidable','inspirant'],neg=['mauvais','mauvaise','nul','nulle','déteste','horrible','haine','idiot','idiote','cringe','déçu','insupportable','méchant','injuste','dégueu','pénible','laid','honte','décevant'];let score=0;pos.forEach(w=>{if(t.includes(w))score++});neg.forEach(w=>{if(t.includes(w))score--});return score>0?'positive':score<0?'negative':'neutral'}function onUserPost(post){const mood=tone(post.text),others=PEOPLE.slice().sort(()=>Math.random()-.5).slice(0,2);others.forEach(p=>post.comments.push({author:p.id,text:REACTIONS[mood][Math.floor(Math.random()*REACTIONS[mood].length)]}));const author=others[Math.floor(Math.random()*others.length)];const statements=mood==='positive'?['Les bonnes nouvelles méritent d’être partagées.','Aujourd’hui, on célèbre les belles choses.','J’aime voir des messages pleins d’énergie.']:mood==='negative'?['On peut être en désaccord sans oublier le respect.','La nuance compte, surtout quand le sujet est sensible.','Je préfère les débats où chacun peut s’exprimer calmement.']:['Question du jour : qu’en pensez-vous ?','Je réfléchis à ce sujet depuis ce matin.','Les conversations intéressantes commencent souvent par une question.'];S.posts.unshift({id:uid(),author:author.id,text:statements[Math.floor(Math.random()*statements.length)],time:Date.now()+1,likes:Math.floor(Math.random()*14),rt:0,liked:false,reposted:false,comments:[{author:others.find(x=>x.id!==author.id)?.id||'lea',text:'Je rebondis sur ce sujet !'}],image:''});if(mood==='positive')S.me.popularity=Math.min(100,(S.me.popularity||50)+2);if(mood==='negative')S.me.popularity=Math.max(0,(S.me.popularity||50)-2);save();renderFeed();if(activeTab==='profile')openProfile(currentProfile)}
function publish(){const text=$('#postText').value.trim();if(!text&&!draftImage){notify('Écris un message ou ajoute une photo.');return}const p={id:uid(),author:'me',text,time:Date.now(),likes:0,rt:0,liked:false,reposted:false,comments:[],image:draftImage};S.posts.unshift(p);$('#postText').value='';$('#postFile').value='';$('#preview').innerHTML='';draftImage='';save();renderFeed();onUserPost(p)}function random(a){return a[Math.floor(Math.random()*a.length)]}
function generateStreamPost(){if(document.hidden){streamTimer=setTimeout(generateStreamPost,4000);return}const a=random(PEOPLE),b=random(PEOPLE.filter(p=>p.id!==a.id)),subjects=['Les meilleures idées arrivent parfois pendant une promenade','Un bon café peut sauver une matinée','Question du jour : quelle chanson vous met de bonne humeur ?','J’ai découvert un endroit qui mérite le détour','Petit rappel amical : prenez aussi le temps de souffler','Je viens de finir un projet et je suis assez fier du résultat','Qui a une recommandation à partager ?','Les petites victoires comptent aussi'];S.posts.unshift({id:uid(),author:a.id,text:random(subjects)+'.',time:Date.now(),likes:Math.floor(Math.random()*22),rt:Math.floor(Math.random()*4),liked:false,reposted:false,comments:[{author:b.id,text:random(['Tellement vrai !','Oh, raconte-nous !','Je suis assez d’accord avec toi.','J’avais besoin de lire ça aujourd’hui.'])}],image:''});if(S.posts.length>100)S.posts.length=100;save();renderFeed();if(activeTab==='profile')openProfile(currentProfile);$('#feedStatus').textContent=`${a.name} a publié`;setTimeout(()=>{if($('#feedStatus'))$('#feedStatus').textContent='Les personnages sont en ligne'},2300);streamTimer=setTimeout(generateStreamPost,5000+Math.random()*8000)}function conversationPost(){const a=random(PEOPLE),b=random(PEOPLE.filter(p=>p.id!==a.id)),topics=['les meilleures idées arrivent parfois pendant une promenade','un bon café peut sauver une matinée','je découvre quelque chose de nouveau chaque semaine','on devrait partager plus souvent nos petites victoires','les recommandations de la communauté sont les meilleures'];S.posts.unshift({id:uid(),author:a.id,text:random(topics)+'.',time:Date.now(),likes:Math.floor(Math.random()*15),rt:0,liked:false,reposted:false,comments:[{author:b.id,text:random(['Je suis d’accord, ça fait du bien !','Tu m’as convaincu, je vais essayer.','Bonne question, j’y réfléchis.','Je partage ce point de vue.'])}],image:''});save();renderFeed();notify(`${a.name} et ${b.name} discutent dans le fil.`)}
function readImage(file,max=1200){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('Fichier image invalide'));const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(max/image.width,max/image.height,1),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};image.src=reader.result};reader.readAsDataURL(file)})}
function renderChatStrip(){const extras=(S.chars||[]).filter(c=>!PEOPLE.some(p=>p.id===c.id));$('#chatStrip').innerHTML=[...PEOPLE,...extras].map(p=>`<button type="button" data-chat="${esc(p.id)}" aria-selected="${p.id===activeChat}">${avatar(p,true)}<span>${esc(p.name.split(' ')[0])}</span></button>`).join('')}function renderMessages(){renderChatStrip();const p=person(activeChat),messages=S.dms?.[activeChat]||[];$('#chatTitle').textContent=`Discussion avec ${p.name}`;$('#messageList').innerHTML=messages.length?messages.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${esc(m.text)}</div>`).join(''):`<div class="empty">Commence une conversation avec ${esc(p.name)}.</div>`;$('#messageList').scrollTop=$('#messageList').scrollHeight}function sendMessage(){const text=$('#messageInput').value.trim();if(!text)return;const personId=activeChat,p=person(personId),list=S.dms[personId]||(S.dms[personId]=[]);list.push({from:'me',text,time:Date.now()});$('#messageInput').value='';save();renderMessages();const reply=personId==='max'?'Haha, tu marques un point. Raconte-moi la suite !':personId==='amina'?'Oh, je vois ! Et qu’est-ce que tu en penses, toi ?':personId==='lea'?'Ça me parle, j’ai une petite anecdote là-dessus !':`C’est intéressant, ${S.me.name}. Tu peux m’en dire un peu plus ?`;setTimeout(()=>{list.push({from:personId,text:reply,time:Date.now()});save();if(activeTab==='messages'&&activeChat===personId)renderMessages()},650+Math.random()*850)}
function openImageFile(file,max){return readImage(file,max).then(data=>data).catch(()=>{notify('Image invalide ou trop volumineuse.');return null})}
function fillProfileForm(){const m=S.me;$('#editName').value=m.name||'';$('#editHandle').value=(m.handle||'@moi').replace(/^@/,'');$('#editBio').value=m.bio||'';$('#editLocation').value=m.location||'';$('#editTheme').value=m.theme||'blue'}function saveProfile(){S.me.name=$('#editName').value.trim()||'Moi';S.me.handle='@'+$('#editHandle').value.trim().replace(/^@/,'').replace(/[^a-zA-Z0-9_.]/g,'');S.me.bio=$('#editBio').value.trim();S.me.location=$('#editLocation').value.trim();S.me.theme=$('#editTheme').value;save();applyTheme();openProfile('me');notify('Profil mis à jour.')}
$('#navHome').onclick=()=>showTab('home');$('#navMessages').onclick=()=>showTab('messages');$('#navProfile').onclick=()=>showTab('profile');$('#publishButton').onclick=publish;$('#newConversation').onclick=conversationPost;$('#postFile').onchange=async e=>{const data=await openImageFile(e.target.files[0],1100);if(!data)return;draftImage=data;$('#preview').innerHTML=`<img class="post-image" src="${data}" alt="Aperçu de la photo">`};$('#editProfile').onclick=()=>openProfile('me');$('#saveProfile').onclick=saveProfile;$('#editAvatarFile').onchange=async e=>{const data=await openImageFile(e.target.files[0],360);if(data){S.me.avatar=data;save();openProfile('me')}};$('#editCoverFile').onchange=async e=>{const data=await openImageFile(e.target.files[0],1400);if(data){S.me.cover=data;save();openProfile('me')}};$('#removeAvatar').onclick=()=>{S.me.avatar='';save();openProfile('me')};$('#removeCover').onclick=()=>{S.me.cover='';save();openProfile('me')};$('#chatStrip').onclick=e=>{const b=e.target.closest('[data-chat]');if(b){activeChat=b.dataset.chat;renderMessages()}};$('#sendMessage').onclick=sendMessage;$('#messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('#clearChat').onclick=()=>{S.dms[activeChat]=[];save();renderMessages();notify('Conversation effacée.')};$('#feed').addEventListener('click',e=>{const profileButton=e.target.closest('[data-profile]');if(profileButton){openProfile(profileButton.dataset.profile);showTab('profile');return}const action=e.target.closest('[data-action]');if(action){const article=action.closest('.post'),post=S.posts.find(p=>p.id===article?.dataset.post);if(!post)return;if(action.dataset.action==='comments'){expanded.has(post.id)?expanded.delete(post.id):expanded.add(post.id);renderFeed()}else if(action.dataset.action==='like'){post.liked=!post.liked;post.likes=Math.max(0,(post.likes||0)+(post.liked?1:-1));save();renderFeed()}else if(action.dataset.action==='repost'){post.reposted=!post.reposted;post.rt=Math.max(0,(post.rt||0)+(post.reposted?1:-1));save();renderFeed()}else if(action.dataset.action==='send-comment'){const input=article.querySelector(`[data-comment-input="${post.id}"]`),text=input.value.trim();if(text){post.comments.push({author:'me',text});save();renderFeed()}}return}const article=e.target.closest('.post');if(article){const post=S.posts.find(p=>p.id===article.dataset.post);if(post){openProfile(post.author);showTab('profile')}}});
applyTheme();$('#myMiniAvatar').innerHTML=avatar(person('me'));renderFeed();streamTimer=setTimeout(generateStreamPost,7000+Math.random()*6000);
</script>
