const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fmt=n=>Number(n||0).toLocaleString('fr-FR');let S={me:{name:'Toi',handle:'moi',bio:'',photo:'',followers:120,banner:'',theme:'blue',popularity:50},chars:[],posts:[],dms:{},over:{}};try{const old=JSON.parse(localStorage.getItem('statusia')||'null');if(old)S={...S,...old,me:{...S.me,...old.me}}}catch{}S.chars||=[];S.posts||=[];S.dms||={};S.over||={};let cur='lea',expanded={},busy=false,draftPhoto='';const save=()=>{try{localStorage.setItem('statusia',JSON.stringify(S))}catch{toast('Le stockage est plein : essaie une image plus petite.')}};const all=()=>CH.concat(S.chars),byId=id=>all().find(c=>c.id===id),meObj=()=>({id:'me',n:S.me.name||'Toi',h:'@'+(S.me.handle||'moi'),e:'🙂',c:'#8bb8ff',p:S.me.photo});function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}function avatar(c,size=''){const src=c.p||S.over[c.id];return `<div class="av ${size}" aria-hidden="true">${src?`<img src="${esc(src)}" alt="">`:esc(c.e||'🙂')}</div>`}function setTheme(){const names=['blue','black','pink','white','yellow'];if(!names.includes(S.me.theme))S.me.theme='blue';document.documentElement.dataset.theme=S.me.theme}function renderProfile(){const m=meObj();$('#meAv').innerHTML=avatar(m);$('#pAv').innerHTML=avatar(m);$('#pName').textContent=m.n;$('#pHandle').textContent=m.h;$('#pBio').textContent=S.me.bio||'Ajoute une bio pour te présenter.';$('#pPosts').textContent=fmt(S.posts.filter(p=>p.who==='me').length);$('#pFollowers').textContent=fmt(S.me.followers);$('#pPopularity').textContent=fmt(S.me.popularity);$('#banner').style.backgroundImage=S.me.banner?`url("${S.me.banner}")`:'';setTheme()}

const POS=['bravo, ça fait du bien de lire ça !','Très belle énergie, je suis d’accord.','J’adore cette idée, merci pour le partage.','Ça donne envie de voir les choses autrement.'],NEG=['Je ne suis pas d’accord, c’est vraiment dommage de présenter les choses comme ça.','Aïe, ce message me met mal à l’aise. On peut en discuter ?','Je trouve ça dur et un peu injuste.','Pas convaincu… il manque peut-être un peu de nuance.'],NEU=['Intéressant, qu’est-ce qui t’a fait penser à ça ?','Je vois l’idée, même si j’ai un autre point de vue.','Ça mérite une vraie discussion !','Je n’y avais pas pensé comme ça.'];function sentiment(t){const x=t.toLowerCase(),pos=['bien','bon','bonne','super','merci','bravo','aime','ador','génial','heureux','heureuse','magnifique','cool','parfait','excellent','love','❤️','😊','✨'],neg=['mal','mauvais','mauvaise','nul','nulle','déteste','déteste','horrible','laid','laide','idiot','idiote','haine','dégueu','catastrophe','😭','😡'];let score=0;for(const w of pos)if(x.includes(w))score++;for(const w of neg)if(x.includes(w))score--;return score>0?'positive':score<0?'negative':'neutral'}function bumpPopularity(delta){S.me.popularity=Math.max(0,Math.min(100,(Number(S.me.popularity)||50)+delta));save();renderProfile()}function respondToUserPost(p){const mood=sentiment(p.text),pool=all().filter(c=>c.id!==p.who),n=mood==='neutral'?1:2;for(let i=0;i<n;i++){const c=pool[Math.floor(Math.random()*pool.length)];if(c)p.cm.push({who:c.id,text:(mood==='positive'?POS:mood==='negative'?NEG:NEU)[Math.floor(Math.random()*(mood==='positive'?POS:mood==='negative'?NEG:NEU).length)]})}const author=pool[Math.floor(Math.random()*pool.length)];if(author){const ownText=mood==='positive'?['Petit rappel : les bonnes nouvelles se partagent !','On a besoin de plus de messages comme ça.','Cette publication m’a mis de bonne humeur.'][Math.floor(Math.random()*3)]:mood==='negative'?['On peut exprimer un désaccord sans se manquer de respect.','Je vois passer un débat animé… prenons le te function localCharacterPost(){const pool=all();if(pool.length<2)return;const a=pool[Math.floor(Math.random()*pool.length)],b=pool.filter(x=>x.id!==a.id)[Math.floor(Math.random()*(pool.length-1))],topics=['le café du matin est sous-coté','j’ai découvert un endroit génial ce week-end','question sérieuse : vous choisissez quoi pour le dîner ?','les petites victoires méritent aussi d’être célébrées','j’ai besoin de vos recommandations','parfois, une pause fait toute la différence','qui a une bonne playlist à partager ?','on devrait parler plus souvent de ce qui nous passionne'];const text=topics[Math.floor(Math.random()*topics.length)];S.posts.unshift({id:uid(),who:a.id,text,t:Date.now(),likes:Math.floor(Math.random()*20),liked:false,rt:0,rted:false,cm:[{who:b.id,text:['Tellement d’accord !','Je ne suis pas sûr… raconte.','Ah, ça me parle beaucoup.','Je note, merci pour l’idée !'][Math.floor(Math.random()*4)]}]});if(S.posts.length>100)S.posts.length=100;save();renderFeed();renderMyPosts();$('#streamStatus').textContent=`${a.n} et ${b.n} discutent · en direct`;setTimeout(()=>$('#streamStatus').textContent='Les personnages sont en ligne',2800)}function scheduleStream(){setTimeout(()=>{localCharacterPost();scheduleStream()},5000+Math.random()*8000)}async function aiConversation(){const pool=all();if(pool.length<2)return;const a=pool[Math.floor(Math.random()*pool.length)],b=pool.filter(x=>x.id!==a.id)[Math.floor(Math.random()*(pool.length-1))];if(!API.key){localCharacterPost();return}try{const raw=await ask(`Écris un bref échange amusant entre ces personnages: ${a.n} (${a.b}) et ${b.n} (${b.b}). Réponds uniquement en JSON: {"post":"publication de A, une phrase","reply":"réponse de B, une phrase"}. Français.`,220),d=JSON.parse(raw.match(/\{[\s\S]*\}/)?.[0]||raw);S.posts.unshift({id:uid(),who:a.id,text:String(d.post||'Une pensée du jour !'),t:Date.now(),likes:2,liked:false,rt:0,rted:false,cm:[{who:b.id,text:String(d.reply||'Bien vu !')}]});save();renderFeed()}catch{localCharacterPost()}}
function readImage(file,max=1200,square=false){return new Promise((ok,no)=>{if(!file||!file.type.startsWith('image/'))return no(Error('Fichier image requis'));const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');if(square){const side=Math.min(im.width,im.height);c.width=Math.min(side,max);c.height=c.width;ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,c.width,c.height)}else{const s=Math.min(max/im.width,max/im.height,1);c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);ctx.drawImage(im,0,0,c.width,c.height)}ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function tab(n){for(const x of ['F','M','P']){$('#v'+x).hidden=x!==n;$('#t'+x).setAttribute('aria-selected',x===n)}if(n==='P'){renderProfile();renderMyPosts()}if(n==='M'){renderStrip();renderMessages()}}function renderStrip(){$('#strip').innerHTML=all().map(c=>`<button data-id="${esc(c.id)}" aria-selected="${c.id===cur}">${avatar(c,'s')}<span>${esc(c.n.split(' ')[0])}</span></button>`).join('')}function renderMessages(){const c=byId(cur)||CH[0],h=S.dms[cur]||[];$('#chead').innerHTML=avatar(c,'s')+`<div><b>${esc(c.n)}</b><div class="hd">${fmt(c.f)} abonnés</div></div>`;$('#msgs').innerHTML=h.length?h.map(m=>`<div class="m ${m.r==='me'?'me':''}">${esc(m.text)}</div>`).join(''):`<div class="empty">Commence une conversation avec ${esc(c.n)}.</div>`;$('#msgs').scrollTop=$('#msgs').scrollHeight}async function sendMessage(){const text=$('#mi').value.trim();if(!text||busy)return;busy=true;$('#mb').disabled=true;const c=byId(cur)||CH[0],h=S.dms[cur]||(S.dms[cur]=[]);h.push({r:'me',text});$('#mi').value='';save();renderMessages();try{const answer=API.key?await ask(`Tu es ${c.n}, ${c.b}. Réponds en français, naturellement et brièvement. Conversation récente:\n${h.slice(-12).map(m=>(m.r==='me'?'Utilisateur':c.n)+': '+m.text).join('\n')}`,350):'Je suis là ! Configure une clé IA dans ton profil pour une réponse personnalisée.';h.push({r:'ai',text:answer})}catch(e){h.push({r:'ai',text:'Je rencontre un souci technique pour répondre. Réessaie dans un instant.'});toast(e.message)}save();renderMessages();busy=false;$('#mb').disabled=false}
function fillForm(){$('#fName').value=S.me.name||'';$('#fHandle').value=S.me.handle||'';$('#fBio').value=S.me.bio||'';$('#fFol').value=S.me.followers||0;$('#fTheme').value=S.me.theme||'blue';fillAI()}function saveProfile(){S.me.name=$('#fName').value.trim()||'Toi';S.me.handle=$('#fHandle').value.trim().replace(/^@/,'').replace(/[^a-zA-Z0-9_.]/g,'')||'moi';S.me.bio=$('#fBio').value.trim();S.me.followers=Math.max(0,Number($('#fFol').value)||0);S.me.theme=$('#fTheme').value;save();renderProfile();renderFeed();renderMyPosts()}
function myChars(){$('#myChars').innerHTML=S.chars.length?S.chars.map(c=>`<div class="mine">${avatar(c)}<div><b>${esc(c.n)}</b><div class="hd">${esc(c.h)}</div></div><button class="btn ghost" data-action="delete" data-id="${esc(c.id)}">Supprimer</button></div>`).join(''):'<p class="helper">Aucun personnage personnalisé.</p>'}
$('#pb').onclick=publish;$('#postPhoto').onchange=async e=>{try{draftPhoto=await readImage(e.target.files[0]);$('#photoPreview').innerHTML=`<img class="post-image" src="${draftPhoto}" alt="Aperçu de la photo">`;$('#removePostPhoto').hidden=false}catch{toast('Image illisible.')}};$('#removePostPhoto').onclick=()=>{draftPhoto='';$('#postPhoto').value='';$('#photoPreview').innerHTML='';$('#removePostPhoto').hidden=true};$('#feed').onclick=e=>{const el=e.target.closest('.post');if(!el)return;const p=S.posts.find(x=>x.id===el.dataset.id);if(!p)return;const b=e.target.closest('button');if(!b){expanded[p.id]=!expanded[p.id];renderFeed();return}if(b.dataset.a==='comments'){expanded[p.id]=!expanded[p.id];renderFeed()}else if(b.dataset.a==='like'){p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));save();renderFeed()}else if(b.dataset.a==='repost'){p.rted=!p.rted;p.rt=(p.rt||0)+(p.rted?1:-1);save();renderFeed()}else if(b.dataset.a==='send'){const input=el.querySelector('input'),text=input.value.trim();if(text){p.cm.push({who:'me',text});save();renderFeed()}}};$('#talkNow').onclick=()=>{aiConversation();$('#talkNow').blur()};
$('#tF').onclick=()=>tab('F');$('#tM').onclick=()=>tab('M');$('#tP').onclick=()=>tab('P');$('#editProfile').onclick=()=>{const panel=$('#profileEdit');panel.hidden=!panel.hidden;if(!panel.hidden){fillForm();panel.scrollIntoView({behavior:'smooth',block:'start')}}};$('#saveProfile').onclick=()=>{$('#profileEdit').hidden=true;saveProfile();toast('Profil enregistré.')};$('#fProv').onchange=e=>{API.prov=e.target.value;fillAI()};$('#fKey').oninput=e=>API.key=e.target.value.trim();$('#fModel').oninput=e=>API.model=e.target.value.trim();$('#fPhoto').onchange=async e=>{try{S.me.photo=await readImage(e.target.files[0],250,true);renderProfile()}catch{toast('Photo illisible.')}};$('#fBanner').onchange=async e=>{try{S.me.banner=await readImage(e.target.files[0],1400);renderProfile()}catch{toast('Bannière illisible.')}};$('#fNoPhoto').onclick=()=>{S.me.photo='';$('#fPhoto').value='';renderProfile()};$('#fNoBanner').onclick=()=>{S.me.banner='';$('#fBanner').value='';renderProfile()};$('#mb').onclick=sendMessage;$('#mi').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('#strip').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){cur=b.dataset.id;renderStrip();renderMessages()}};$('#cl').onclick=()=>{if(confirm('Effacer cette conversation ?')){S.dms[cur]=[];save();renderMessages()}};
$('#cMake')?.addEventListener('click',async()=>{const name=$('#cName').value.trim(),bio=$('#cBioChar').value.trim();if(!name||!bio){toast('Ajoute un nom et une personnalité.');return}let photo='';if($('#cPhoto').files[0])try{photo=await readImage($('#cPhoto').files[0],220,true)}catch{toast('Photo illisible.');return}S.chars.push({id:'c'+uid(),n:name,h:'@'+($('#cHandleChar').value.trim()||name).toLowerCase().replace(/[^a-z0-9_]/g,''),b:bio,e:$('#cEmoji').value||'🙂',f:1000,p:photo});save();myChars();renderProfile()});$('#myChars').onclick=e=>{const b=e.target.closest('[data-action="delete"]');if(!b)return;S.chars=S.chars.filter(c=>c.id!==b.dataset.id);save();myChars();renderProfile();renderFeed()};
S.posts=S.posts.map(p=>({...p,cm:Array.isArray(p.cm)?p.cm:[],likes:Number(p.likes)||0,rt:Number(p.rt)||0}));renderProfile();renderFeed();if(S.posts.length<4)for(let i=0;i<4;i++)localCharacterPost();scheduleStream();setInterval(()=>{if(!document.hidden&&Math.random()<.3)aiConversation()},60000);
</script></body></html>
