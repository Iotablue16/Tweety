<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Status IA</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#0d1117;
      --card:#111827;
      --ink:#f3f4f6;
      --mute:#9ca3af;
      --line:#2a3446;
      --acc:#1d9bf0;
      --acc-ink:#fff;
      --me:#1d9bf0;
      --bub:#1c2330;
      --soft:#f3f4f6;
      --danger:#ff5d7a;
      --success:#1ec88a;
      --shadow:rgba(0,0,0,.28);
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }

    :root[data-theme="blue"] {
      --bg:#edf6ff;
      --card:#ffffff;
      --ink:#122133;
      --mute:#5e7086;
      --line:#dfeaf9;
      --acc:#1c7ef2;
      --acc-ink:#ffffff;
      --me:#1c7ef2;
      --bub:#eef5ff;
      --soft:#f7fbff;
    }

    :root[data-theme="black"] {
      --bg:#000000;
      --card:#0d1117;
      --ink:#f3f4f6;
      --mute:#9aa3af;
      --line:#2b2f36;
      --acc:#1d9bf0;
      --acc-ink:#ffffff;
      --me:#1d9bf0;
      --bub:#171b22;
      --soft:#0f1726;
    }

    :root[data-theme="pink"] {
      --bg:#fff1f7;
      --card:#ffffff;
      --ink:#2a1320;
      --mute:#7c5e6a;
      --line:#f3d8e4;
      --acc:#e84d96;
      --acc-ink:#fff;
      --me:#e84d96;
      --bub:#fff0f6;
      --soft:#fff7fb;
    }

    :root[data-theme="white"] {
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111827;
      --mute:#6b7280;
      --line:#e5e7eb;
      --acc:#333333;
      --acc-ink:#ffffff;
      --me:#333333;
      --bub:#f3f4f6;
      --soft:#f9fafb;
    }

    :root[data-theme="yellow"] {
      --bg:#fff9de;
      --card:#fffdf7;
      --ink:#2c2410;
      --mute:#7d6d3a;
      --line:#efe2a8;
      --acc:#d9a300;
      --acc-ink:#1e1803;
      --me:#d9a300;
      --bub:#fff4c9;
      --soft:#fffdf4;
    }

    *{box-sizing:border-box}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      transition:.2s ease;
    }
    .app{
      max-width:640px;
      margin:0 auto;
      min-height:100vh;
      background:var(--card);
      border-inline:1px solid var(--line);
      position:relative;
    }
    header{
      position:sticky;
      top:0;
      z-index:25;
      background:color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    h1{margin:0;padding:14px 16px 6px;font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
    nav{
      display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(640px,100%);background:var(--card);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom,0px);z-index:30;
    }
    nav button{
      flex:1;padding:12px;border:0;background:none;color:var(--mute);
      font:600 1rem inherit;font-family:inherit;border-bottom:3px solid transparent;cursor:pointer;
    }
    nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
    button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
    .av{
      flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
      font-size:1.3rem;background:linear-gradient(135deg,#dbeafe,#f5d0fe);overflow:hidden;border:1px solid rgba(255,255,255,.18);
      box-shadow:0 4px 10px rgba(0,0,0,.18);
    }
    .av.s{width:34px;height:34px;font-size:1rem}
    .av img{width:100%;height:100%;object-fit:cover;display:block}
    .composer{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
    select, textarea, input[type=text], input[type=password], input[type=color]{
      width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;resize:none;
    }
    .btn{
      border:0;background:var(--acc);color:var(--acc-ink);font:600 .95rem inherit;font-family:inherit;
      padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s ease;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:disabled{opacity:.5;cursor:default}
    .btn.ghost{
      background:transparent;color:var(--ink);border:1px solid var(--line);
    }
    .row{display:flex;gap:10px;align-items:center}
    .bar{
      display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--mute);font-size:.9rem;
      background:var(--soft);border-bottom:1px solid var(--line);
    }
    .post{
      display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
      cursor:pointer;
    }
    .post:hover{background:color-mix(in srgb, var(--soft) 75%, transparent)}
    .post .body{flex:1;min-width:0}
    .who{font-weight:800;display:inline-block}.hd{color:var(--mute);font-size:.9rem}
    .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 10px;font-size:1rem}
    .acts{display:flex;justify-content:space-between;max-width:420px;color:var(--mute);font-size:.92rem;align-items:center}
    .acts button{
      border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px
    }
    .acts button.on{color:#f91880}
    .acts button.rt{color:#00ba7c}
    .acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
    .acts button.on svg{fill:currentColor}
    .cm{margin-top:10px;padding-left:12px;border-left:2px solid var(--line)}
    .cm .c{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
    .cm .c b{font-weight:800}
    .empty{padding:40px 24px;text-align:center;color:var(--mute)}
    .strip{
      display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);
    }
    .strip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--mute);font:.8rem inherit;font-family:inherit;padding:6px 8px;border-radius:12px;cursor:pointer}
    .strip button[aria-selected=true]{background:var(--bg);color:var(--ink)}
    .chat{display:flex;flex-direction:column;height:calc(100vh - 330px);min-height:360px}
    .msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
    .m{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--bub);white-space:pre-wrap;overflow-wrap:anywhere}
    .m.me{align-self:flex-end;background:var(--me);color:var(--acc-ink);border-bottom-right-radius:6px}
    .m.ai{border-bottom-left-radius:6px}
    .send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--soft)}
    .toast{
      position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
      background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;max-width:90%;z-index:999;
      box-shadow:0 12px 28px var(--shadow);
    }
    .vb{width:16px;height:16px;vertical-align:-3px;margin-left:2px}
    .prof{padding:16px}
    .banner{
      height:150px;
      margin:-16px -16px 14px;
      border-radius:0 0 18px 18px;
      background:linear-gradient(135deg,#dfeaf9,#f5d0fe) center/cover no-repeat;
      border-bottom:1px solid var(--line);
      position:relative;
      overflow:hidden;
    }
    .banner::after{
      content:"";
      position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.2), rgba(0,0,0,0));
    }
    .prof h2{font-size:1.1rem;margin:20px 0 8px}
    .fld{
      display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mute);margin:8px 0;flex:1;min-width:140px
    }
    .fld input[type=color]{height:42px;padding:4px;border-radius:10px}
    .mine{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
    .mine>div:nth-child(2){flex:1;min-width:120px}
    [hidden]{display:none!important}
    @media (max-width: 440px){
      .composer{padding:12px 12px}
      .post{padding:12px}
      .prof{padding:12px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Status IA</h1>
      <nav role="tablist">
        <button role="tab" id="tF" aria-selected="true">Accueil</button>
        <button role="tab" id="tM" aria-selected="false">Messages</button>
        <button role="tab" id="tP" aria-selected="false">Profil</button>
      </nav>
    </header>

    <section id="vF">
      <div class="composer">
        <div id="meAv"></div>
        <div style="flex:1">
          <textarea id="pt" rows="2" placeholder="Quoi de neuf ?" aria-label="Nouvelle publication"></textarea>
          <div class="row" style="justify-content:flex-end;margin-top:8px">
            <button class="btn" id="pb" type="button">Publier</button>
          </div>
        </div>
      </div>

      <div class="bar">
        <span id="fs">Les personnages réagissent à tes publications.</span>
        <button class="btn ghost" id="rf" type="button">Nouvelles publications</button>
      </div>

      <div id="feed"></div>
    </section>

    <section id="vP" hidden>
      <div class="prof">
        <div id="banner" class="banner"></div>

        <div class="row" style="gap:14px;align-items:center">
          <div id="pAv"></div>
          <div>
            <div class="who" id="pName"></div>
            <div class="hd" id="pStat"></div>
          </div>
        </div>

        <button class="btn ghost" id="editProfile" type="button">Modifier</button>

        <div id="profileEdit" hidden>
          <h2>Mon profil</h2>
          <label class="fld">Nom<input type="text" id="fName" maxlength="30"></label>
          <label class="fld">Identifiant<input type="text" id="fHandle" maxlength="20"></label>
          <label class="fld">Bio<input type="text" id="fBio" maxlength="120"></label>
          <label class="fld">Mes abonnés<input type="text" inputmode="numeric" id="fFol"></label>

          <label class="fld">Fournisseur d’IA
            <select id="fProv">
              <option value="gemini">Google Gemini (gratuit)</option>
              <option value="anthropic">Anthropic Claude (payant)</option>
            </select>
          </label>

          <label class="fld">Clé API (stockée uniquement dans ce navigateur)
            <input type="password" id="fKey" autocomplete="off">
          </label>

          <label class="fld">Modèle
            <input type="text" id="fModel" autocomplete="off">
          </label>

          <div class="hd" id="fHelp" style="margin:8px 0"></div>

          <div class="row" style="flex-wrap:wrap">
            <label class="fld">Photo de profil<input type="file" accept="image/*" id="fPhoto"></label>
            <label class="fld">Couleur de l’avatar<input type="color" id="fColor"></label>
            <label class="fld">Couleur de l’application<input type="color" id="fAcc"></label>
          </div>

          <div class="row" style="flex-wrap:wrap;gap:8px">
            <button class="btn ghost" id="fNoPhoto" type="button">Retirer la photo</button>
            <button class="btn ghost" id="fNoBanner" type="button">Retirer la bannière</button>
          </div>

          <label class="fld">Bannière du profil<input type="file" accept="image/*" id="fBanner"></label>

          <label class="fld">Thème de l’application
            <select id="fTheme">
              <option value="blue">Bleu</option>
              <option value="black">Noir</option>
              <option value="pink">Rose</option>
              <option value="white">Blanc</option>
              <option value="yellow">Jaune</option>
            </select>
          </label>

          <button class="btn" id="saveProfile" type="button">Terminer</button>

          <h2>Créer un personnage</h2>
          <label class="fld">Nom<input type="text" id="cName" maxlength="30"></label>
          <label class="fld">Identifiant<input type="text" id="cHandle" maxlength="20"></label>
          <label class="fld">Personnalité<textarea id="cBio" rows="3" maxlength="300"></textarea></label>
          <div class="row" style="flex-wrap:wrap">
            <label class="fld">Emoji<input type="text" id="cEmoji" maxlength="4" placeholder="🦊"></label>
            <label class="fld">Abonnés<input type="text" inputmode="numeric" id="cFol" placeholder="1000"></label>
            <label class="fld">Couleur<input type="color" id="cColor" value="#f3dff0"></label>
          </div>
          <label class="fld">Photo<input type="file" accept="image/*" id="cPhoto"></label>
          <button class="btn" id="cMake" type="button">Créer le personnage</button>

          <h2>Photos des personnages</h2>
          <div class="hd">Remplace l’avatar illustré par une vraie photo de ton choix.</div>
          <div id="allChars"></div>
          <input type="file" accept="image/*" id="ph" hidden>

          <h2>Mes personnages</h2>
          <div id="myChars"></div>
        </div>
      </div>
    </section>

    <section id="vM" hidden>
      <div class="strip" id="strip" role="tablist"></div>
      <div class="bar">
        <span>Messages illimités · tout l’historique est conservé</span>
        <button class="btn ghost" id="cl" type="button">Effacer</button>
      </div>
      <div class="chat">
        <div class="chead" id="chead" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)"></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="send">
          <textarea id="mi" rows="1" placeholder="Écrire un message" aria-label="Message"></textarea>
          <button class="btn" id="mb" type="button">Envoyer</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    const CH = [
      { id: "lea", n: "Léa Marchand", h: "@lea_voyage", e: "✈️", c: "#bfe3f2", b: "globe-trotteuse enthousiaste, adore les anecdotes de voyage", f: 48200, p: "" },
      { id: "max", n: "Maxime", h: "@max_gamer", e: "🎮", c: "#d8c8f3", b: "gamer sarcastique mais attachant, parle jeux vidéo", f: 12900, p: "" },
      { id: "ami", n: "Amina", h: "@amina_cuisine", e: "🍲", c: "#f8d9b6", b: "cheffe chaleureuse, partage recettes et astuces", f: 91500, p: "" },
      { id: "hen", n: "Pr Henri", h: "@henri_savoir", e: "📚", c: "#d6e3c3", b: "érudit pince-sans-rire, adore les faits surprenants", f: 7300, p: "" },
      { id: "jad", n: "Jade", h: "@jade_fit", e: "💪", c: "#f6c6cf", b: "coach sportive ultra motivante", f: 63400, p: "" },
      { id: "theo", n: "Théo", h: "@theo_techno", e: "💻", c: "#c3d7f6", b: "développeur geek, blagues de code et gadgets", f: 21800, p: "" },
      { id: "nou", n: "Nour", h: "@nour_art", e: "🎨", c: "#f3dff0", b: "artiste rêveuse, poétique et curieuse", f: 5600, p: "" },
      { id: "gus", n: "Gus", h: "@gus_foot", e: "⚽", c: "#cfe9d4", b: "supporter de foot de mauvaise foi, drôle", f: 34100, p: "" }
    ];

    const NEW = {
      lea: { n: "Léa | en transit", h: "@transit_lea", s: "travel", b: "backpackeuse de 27 ans, toujours dans un aéroport ou un train, adore les bons plans, râle sur les retards" },
      max: { n: "Maxime", h: "@M4xLag", s: "game", b: "gamer de 24 ans sarcastique, accuse le lag pour tout, parle de jeux vidéo, répond court avec ironie" },
      ami: { n: "Amina 🍋 cuisine", h: "@marmite_amina", s: "cook", b: "cuisine maison, partage recettes simples et astuces anti-gaspi, chaleureuse" },
      hen: { n: "Henri Lefèvre", h: "@bibliophage_", s: "books", b: "prof d’histoire retraité, érudit pince-sans-rire, sort des faits surprenants, corrige les erreurs avec ironie" },
      jad: { n: "Jade Coach", h: "@jade_sweat", s: "fit", b: "coach sportive très motivante, parle de séances et de nutrition simple" },
      theo: { n: "Théo", h: "@theo_404", s: "code", b: "développeur backend de 29 ans, blagues de code, galères de prod, trop de café" },
      nou: { n: "nour", h: "@nour_encre", s: "art", b: "illustratrice rêveuse qui écrit en minuscules, poétique, parle de dessin et de lumière" },
      gus: { n: "Gus", h: "@arbitre_vendu", s: "foot", b: "supporter de foot de mauvaise foi, tout est la faute de l’arbitre, drôle et excessif" }
    };

    const SORTED = CH.map(c => ({ ...c, ...NEW[c.id] }));
    const $ = (sel) => document.querySelector(sel);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const esc = (s) => String(s ?? "").replace(/[&<>\"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m]));
    const fmt = (n) => {
      const value = Number(n || 0);
      if (value >= 1_000_000) return (value / 1_000_000).toFixed(1).replace(".", ",") + " M";
      if (value >= 10_000) return (value / 1_000).toFixed(1).replace(".", ",") + " k";
      return value.toLocaleString("fr-FR");
    };
    const save = () => {
      try { localStorage.setItem("statusia", JSON.stringify(S)); } catch (e) {}
    };
    const ls = (key, value) => {
      try {
        if (value === undefined) return localStorage.getItem(key) || "";
        if (value === null || value === "") localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      } catch (e) {}
    };

    let S = {
      me: {
        name: "Toi",
        handle: "moi",
        bio: "Je poste ce qui me passe par la tête.",
        photo: "",
        color: "#bfc7d1",
        accent: "#1d9bf0",
        followers: 120,
        banner: "",
        theme: "blue"
      },
      chars: [],
      posts: [],
      dms: {},
      over: {}
    };

    try {
      const raw = localStorage.getItem("statusia");
      if (raw) {
        const next = JSON.parse(raw);
        S = { ...S, ...next, me: { ...S.me, ...(next.me || {}) } };
      }
    } catch (e) {}

    const all = () => [...SORTED, ...(S.chars || [])];
    const byId = (id) => all().find(c => c.id === id);

    const meObj = () => ({
      n: S.me.name || "Toi",
      h: "@" + (S.me.handle || "moi"),
      e: "🙂",
      c: S.me.color || "#bfc7d1",
      p: S.me.photo || "",
      id: "me"
    });

    function toast(msg) {
      const el = $("#toast");
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.hidden = true, 3200);
    }

    function ago(ts) {
      const s = Math.max(0, Math.floor((Date.now() - ts) / 60000));
      if (s < 1) return "à l’instant";
      if (s < 60) return s + " min";
      if (s < 1440) return Math.floor(s / 60) + " h";
      return Math.floor(s / 1440) + " j";
    }

    function avh(c, cls = "") {
      const src = c.p || S.over[c.id] || (c.s && SC[c.s]);
      return `
        <div class="av ${cls}" style="background:${c.c || '#dbeafe'}">
          ${src ? `<img src="${esc(src)}" alt="">` : esc(c.e || "🙂")}
        </div>
      `;
    }

    const BADGE = `
      <svg class="vb" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l2.4 2 3.1-.2 1 3 2.6 1.8-1 3 1 3-2.6 1.8-1 3-3.1-.2L12 22l-2.4-2-3.1.2-1-3L2.9 15.4l1-3-1-3 2.6-1.8 1-3 3.1.2z" fill="#1d9bf0"/>
        <path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
      </svg>
    `;

    const I = {
      re: ` <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg> `,
      rt: ` <svg viewBox="0 0 24 24"><path d="M4 9l3-3 3 3M7 6v9a3 3 0 003 3h6M20 15l-3 3-3-3M17 18V9a3 3 0 00-3-3H8"/></svg> `,
      h: ` <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg> `,
      v: ` <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg> `
    };

    function roster() {
      return all().map(c => `${c.id}: ${c.n}, ${c.b}`).join("\n");
    }

    function renderTheme() {
      const theme = S.me.theme || "blue";
      document.documentElement.dataset.theme = theme;
      $("#fTheme").value = theme;
      document.documentElement.style.colorScheme = theme === "black" ? "dark" : "light";
    }

    function setTheme(theme) {
      const valid = ["blue", "black", "pink", "white", "yellow"];
      const selected = valid.includes(theme) ? theme : "blue";
      S.me.theme = selected;
      save();
      renderTheme();
    }

    function renderBanner(){
      const b = $("#banner");
      if (!b) return;
      if (S.me.banner) {
        b.style.backgroundImage = `url("${S.me.banner}")`;
        b.style.backgroundSize = "cover";

    function readPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const size = 180;
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const sx = Math.min(img.width, img.height);
            const x = (img.width - sx) / 2;
            const y = (img.height - sx) / 2;
            ctx.drawImage(img, x, y, sx, sx, 0, 0, size, size);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function readBanner(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 1200, maxH = 360;
            let w = img.width, h = img.height;
            const ratio = Math.min(maxW / w, maxH / h, 1);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function sample(prompt, opt = {}) {
      const provider = API.prov || "gemini";
      const headers = { "content-type": "application/json" };
      const key = API.key;
      const model = API.model;

      if (!key) throw new Error("missing_key");

      if (provider === "gemini") {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
        const body = {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: Math.min(opt.max || 800, 2048) }
        };
        const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err?.error?.message || "gemini_error");
        }
        const json = await res.json();
        const text = json?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
        if (!text) throw new Error("empty_response");
        return { text };
      }

      const url = "https://api.anthropic.com/v1/messages";
      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      const body = {
        model,
        max_tokens: Math.min(opt.max || 800, 4096),
        messages: [{ role: "user", content: prompt }]
      };
      const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || "anthropic_error");
      }
      const json = await res.json();
      const text = (json.content || []).map(c => c.text || "").join("");
      if (!text) throw new Error("empty_response");
      return { text };
    }

    async function ai(prompt) {
      if (needKey()) return null;
      try {
        const result = await sample(prompt, { max: 1200 });
        const text = result.text.trim();
        try {
          const parsed = JSON.parse(text);
          return parsed;
        } catch {
          const match = text.match(/[\[{].*[\]}]/s);
          if (match) {
            try { return JSON.parse(match[0]); } catch {}
          }
          return null;
        }
      } catch (e) {
        toast("Erreur IA : vérifie ta clé API et le modèle.");
        return null;
      }
    }

    function sentiment(text) {
      const t = String(text).toLowerCase();
      const positive = ["bien","super","top","excellent","amazing","adorable","génial","cool","merci","j’aime","je kiffe","magnifique","parfait","sûr","heureux","content","wow","sublime"];
      const negative = ["mauvais","nul","horrible","détestable","moche","gênant","pitoyable","ennuyeux","dégueulasse","raté","barbare","vide","moche","nul","pénible","bof"];
      let score = 0;
      positive.forEach(w => { if (t.includes(w)) score += 1; });
      negative.forEach(w => { if (t.includes(w)) score -= 1; });
      if (score > 0) return "positive";
      if (score < 0) return "negative";
      return "neutral";
    }

    function reactToPost(post, reason = "") {
      const author = post.who === "me" ? meObj() : byId(post.who) || { n: "Inconnu", h: "@inconnu", e: "🤖", c: "#c7d2fe" };
      const prompt = `
      Tu es sur un réseau social réaliste. 
      Personnages : ${roster()}
      Publication actuelle de ${author.n} (${author.h}): "${post.text}"
      Contexte supplémentaire : "${reason || ""}"
      Réponds uniquement en JSON :
      {"comments":[{"who":"id","text":"..."}],"likes": 1}
      - 1 à 3 commentaires courts, très naturels, français, souvent familiers, parfois humoristiques.
      - Les commentaires doivent venir de personnages différents.
      - Certains commentaires peuvent être positifs, d’autres négatifs selon le contenu.
      - Les réactions doivent être crédibles et alignées avec la personnalité.
      `;

      return ai(prompt).then(result => {
        if (!result || !Array.isArray(result.comments)) return;
        const comments = result.comments.filter(c => byId(c.who) && c.text);
        comments.forEach(c => {
          post.cm.push({ who: c.who, text: String(c.text) });
        });
        post.likes = Math.max(0, (post.likes || 0) + (Number(result.likes) || 0));
        save();
        renderFeed();
      }).catch(() => {});
    }

      $("#fName").oninput = e => { S.me.name = e.target.value; save(); renderMe(); };
      $("#fHandle").oninput = e => {
        S.me.handle = e.target.value.replace(/[^a-zA-Z0-9_]/g, "");
        save();
        renderMe();
      };
      $("#fBio").oninput = e => { S.me.bio = e.target.value; save(); };
      $("#fFol").oninput = e => {
        S.me.followers = Math.max(0, parseInt(e.target.value, 10) || 0);
        save();
        renderMe();
      };
      $("#fColor").oninput = e => updateMe("color", e.target.value);
      $("#fAcc").oninput = e => updateMe("accent", e.target.value);
      $("#fTheme").onchange = e => setTheme(e.target.value);
      $("#fProv").onchange = e => {
        API.prov = e.target.value;
        aiFields();
      };
      $("#fKey").oninput = e => { API.key = e.target.value.trim(); };
      $("#fModel").oninput = e => { API.model = e.target.value.trim(); };

      $("#fPhoto").onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          updateMe("photo", await readPhoto(file));
          toast("Photo de profil mise à jour.");
        } catch {
          toast("Image illisible.");
        }
      };
      $("#fBanner").onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          updateMe("banner", await readBanner(file));
          toast("Bannière mise à jour.");
        } catch {
          toast("Image illisible.");
        }
      };
      $("#fNoPhoto").onclick = () => updateMe("photo", "");
      $("#fNoBanner").onclick = () => updateMe("banner", "");

      $("#cPhoto").onchange = e => handleFileToMemory(e.target, "statusia_new_character_photo");
      $("#cMake").onclick = createCharacter;

      $("#myChars").onclick = e => {
        const button = e.target.closest("button[data-a]");
        if (!button) return;
        const id = button.dataset.id;

        if (button.dataset.a === "chat") {
          cur = id;
          tab("M");
        } else if (button.dataset.a === "del" && confirm("Supprimer ce personnage et ses publications ?")) {
          S.chars = S.chars.filter(c => c.id !== id);
          S.posts = S.posts.filter(p => p.who !== id);
          S.posts.forEach(p => { p.cm = (p.cm || []).filter(c => c.who !== id); });
          delete S.dms[id];
          if (cur === id) cur = "lea";
          save();
          renderFeed();
          myChars();
          strip();
          renderMessages();
        }
      };

      let phId = "";
      $("#allChars").onclick = e => {
        const button = e.target.closest("button[data-a]");
        if (!button) return;
        phId = button.dataset.id;

        if (button.dataset.a === "ph") {
          $("#ph").click();
        } else if (button.dataset.a === "rp") {
          delete S.over[phId];
          const character = S.chars.find(c => c.id === phId);
          if (character) character.p = "";
          save();
          myChars();
          renderFeed();
        }
      };
      $("#ph").onchange = async e => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file || !phId) return;
        try {
          const photo = await readPhoto(file);
          const character = S.chars.find(c => c.id === phId);
          if (character) character.p = photo;
          else S.over[phId] = photo;
          save();
          myChars();
          renderFeed();
          toast("Photo du personnage mise à jour.");
        } catch {
          toast("Image illisible.");
        }
      };
    }

    const SC = {};

    S.posts = (S.posts || []).map(post => ({
      ...post,
      cm: Array.isArray(post.cm) ? post.cm : [],
      likes: Number(post.likes) || 0,
      rt: Number(post.rt) || 0
    }));
    S.chars = S.chars || [];
    S.over = S.over || {};

    initEvents();
    renderTheme();
    renderMe();
    renderFeed();
    tab("F");
    scheduleNextStream();
  </script>
</body>
</html>
